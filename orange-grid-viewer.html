<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Repository Grid + Ripples — hartswf0</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23ff6b35%22/></svg>">
  <style>
    :root{
      --bg:#0a0a0a;
      --text:#f5f3ef;
      --accent:#ff6b35;
      --muted:#888;
      --panel:#1a1a1a;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{
      background:radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 100%);
      color:var(--text);
      font:14px/1.5 -apple-system, sans-serif;
    }

    /* Header */
    header{
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:100;
      background:rgba(10,10,10,0.98);
      backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(255,107,53,0.2);
      padding:12px 20px;
    }

    .header-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:6px 0;
      min-height:24px;
    }

    .header-user{
      font-size:11px;
      color:var(--text);
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:400;
      letter-spacing:0.3px;
      line-height:16px;
      flex-wrap:nowrap;
      white-space:nowrap;
    }

    .header-user strong{
      color:var(--accent);
      font-weight:600;
    }

    .header-name{
      color:var(--text);
      font-weight:600;
      opacity:0.9;
    }

    /* Minimap - Full Width Touchpad */
    .minimap{
      position:relative;
      width:100%;
      background:rgba(0,0,0,0.6);
      padding:8px;
      border-top:1px solid rgba(255,107,53,0.2);
      border-bottom:1px solid rgba(255,107,53,0.2);
    }

    .minimap-container{
      position:relative;
      max-width:100%;
      margin:0 auto;
    }

    .minimap-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, 8px);
      gap:3px;
      justify-content:center;
      width:100%;
    }

    .minimap-dot{
      width:8px;
      height:8px;
      border-radius:2px;
      opacity:0.85;
      transition:all 0.15s ease;
      cursor:pointer;
    }

    .minimap-dot:hover{
      opacity:1;
      transform:scale(1.3);
      box-shadow:0 0 12px currentColor;
      z-index:10;
      position:relative;
    }

    .minimap-dot.active{
      opacity:1;
      transform:scale(1.4);
      box-shadow:0 0 16px currentColor, inset 0 0 8px rgba(255,255,255,0.5);
      border:2px solid rgba(255,255,255,0.9);
      z-index:10;
      position:relative;
    }

    .viewport-indicator{
      position:absolute;
      border:2px solid rgba(255,255,255,0.6);
      background:rgba(255,255,255,0.05);
      pointer-events:none;
      border-radius:2px;
      transition:all 0.2s ease;
      box-shadow:0 0 10px rgba(255,255,255,0.3);
    }

    .hamburger{
      display:none;
      width:24px;
      height:16px;
      border:none;
      background:transparent;
      cursor:pointer;
      flex-direction:column;
      align-items:flex-end;
      justify-content:space-between;
      padding:0;
      flex-shrink:0;
    }

    .hamburger span{
      width:24px;
      height:2px;
      background:var(--accent);
      transition:all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius:1px;
      display:block;
    }

    .hamburger.active span:nth-child(1){
      transform:rotate(45deg) translate(5px, 5px);
    }

    .hamburger.active span:nth-child(2){
      opacity:0;
    }

    .hamburger.active span:nth-child(3){
      transform:rotate(-45deg) translate(5px, -5px);
    }

    .header-grid{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }

    h1{
      font-size:18px;
      font-weight:600;
      letter-spacing:-0.5px;
      margin:0;
    }

    .controls{
      display:flex;
      gap:10px;
      align-items:center;
      font-size:12px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .control-section{
      display:flex;
      gap:8px;
      align-items:center;
    }

    /* Mobile menu */
    .mobile-menu{
      position:fixed;
      top:0;
      left:-220px;
      width:200px;
      height:100vh;
      background:rgba(10,10,10,0.98);
      backdrop-filter:blur(20px);
      border-right:1px solid var(--accent);
      padding:15px;
      transition:left 0.3s ease;
      z-index:200;
      overflow-y:auto;
    }

    .mobile-menu.open{
      left:0;
    }

    .mobile-menu-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
      padding-bottom:15px;
      border-bottom:1px solid rgba(255,107,53,0.2);
    }

    .mobile-menu-title{
      font-size:16px;
      font-weight:700;
      color:var(--accent);
    }

    .mobile-menu-close{
      background:none;
      border:none;
      color:var(--accent);
      font-size:24px;
      cursor:pointer;
      padding:0;
      line-height:1;
    }

    .mobile-menu-section{
      margin-bottom:25px;
    }

    .mobile-menu-label{
      font-size:9px;
      text-transform:uppercase;
      letter-spacing:0.5px;
      color:var(--muted);
      margin-bottom:10px;
      font-weight:700;
    }

    .mobile-menu .btn{
      width:100%;
      margin-bottom:10px;
      justify-content:center;
      padding:12px 8px;
      font-size:13px;
      font-weight:700;
      min-height:48px;
    }

    .mobile-menu select{
      width:100%;
      margin-bottom:10px;
      padding:10px 8px;
      font-size:12px;
      min-height:48px;
    }

    .theme-list{
      display:flex;
      flex-direction:column;
      gap:8px;
      max-height:400px;
      overflow-y:auto;
    }

    .theme-item{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:6px;
      padding:10px;
      cursor:pointer;
      transition:all 0.2s;
    }

    .theme-item:hover, .theme-item.active{
      background:rgba(255,107,53,0.2);
      border-color:var(--accent);
    }

    .theme-item-header{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:4px;
    }

    .theme-item-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      flex-shrink:0;
    }

    .theme-item-name{
      font-size:12px;
      font-weight:600;
      flex:1;
    }

    .theme-item-count{
      font-size:11px;
      opacity:0.7;
    }

    .theme-item-desc{
      font-size:10px;
      opacity:0.6;
      margin-top:4px;
      line-height:1.3;
    }

    .menu-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.5);
      z-index:199;
      display:none;
    }

    .menu-overlay.open{
      display:block;
    }

    @media(max-width:768px){
      .hamburger{
        display:flex;
      }
      
      .header-grid{
        display:none;
      }
      
      #main{top:60px}
      .expanded{inset:60px 10px 10px}
    }

    @media(max-width:640px){
      h1{font-size:16px}
      .header-user{font-size:10px}
    }

    .btn{
      background:transparent;
      border:1px solid var(--accent);
      color:var(--accent);
      padding:6px 14px;
      border-radius:6px;
      cursor:pointer;
      font-size:12px;
      font-weight:600;
      transition:all 0.2s;
    }
    .btn:hover, .btn.active{
      background:var(--accent);
      color:#000;
    }

    .filter-group{
      display:flex;
      gap:8px;
      align-items:center;
      padding-left:15px;
      border-left:1px solid rgba(255,107,53,0.2);
    }

    select{
      background:rgba(255,107,53,0.1);
      border:1px solid rgba(255,107,53,0.3);
      color:var(--text);
      padding:6px 12px;
      border-radius:6px;
      font-size:12px;
      cursor:pointer;
    }

    .zoom-controls{
      display:flex;
      gap:5px;
    }

    .zoom-btn{
      width:30px;
      height:30px;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
    }

    /* Main container */
    #main{
      position:absolute;
      top:70px;
      left:0;
      right:0;
      bottom:0;
      overflow:auto;
    }

    /* Canvas view (organic ripples) */
    #canvas-view{
      position:absolute;
      inset:0;
      display:none;
    }
    #canvas-view.active{display:block}

    canvas{
      width:100%;
      height:100%;
      cursor:grab;
    }
    canvas:active{cursor:grabbing}

    /* Grid view */
    #grid-view{
      display:none;
      padding:30px;
      max-width:1800px;
      margin:0 auto;
    }
    #grid-view.active{display:block}

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
      gap:20px;
      transition:all 0.3s ease;
    }

    .grid.zoom-sm{grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));gap:12px}
    .grid.zoom-lg{grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:28px}
    .grid.zoom-xl{grid-template-columns:repeat(auto-fill, minmax(360px, 1fr));gap:35px}

    .orange{
      position:relative;
      aspect-ratio:1;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:transform 0.3s ease, opacity 0.3s ease;
      overflow:visible;
      opacity:0;
      transform:scale(0.8);
      animation:popIn 0.5s ease forwards;
      touch-action:manipulation;
      -webkit-user-select:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }

    @keyframes popIn{
      to{
        opacity:1;
        transform:scale(1);
      }
    }

    .orange:hover{
      transform:scale(1.1);
      z-index:10;
    }

    .orange:hover .hover-preview,
    .orange.show-preview .hover-preview{
      opacity:1;
      transform:scale(1);
    }

    .orange:hover .orange-content,
    .orange.show-preview .orange-content{
      opacity:0;
    }

    .orange-number{
      position:absolute;
      top:12px;
      right:12px;
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(10px);
      color:#000;
      min-width:50px;
      width:50px;
      height:32px;
      padding:0;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:15px;
      font-weight:700;
      font-family:'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', ui-monospace, monospace;
      letter-spacing:-1px;
      z-index:1000;
      border:1px solid rgba(0,0,0,0.2);
      box-shadow:0 2px 8px rgba(0,0,0,0.2);
      transition:all 0.2s ease;
      pointer-events:auto;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-user-select:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }

    .orange:hover .orange-number{
      background:var(--accent);
      color:#000;
      box-shadow:0 4px 12px rgba(255,107,53,0.5);
    }

    .orange.selected .orange-number{
      background:#fff;
      color:#000;
      box-shadow:0 4px 16px rgba(255,255,255,0.4);
    }

    /* Larger screens need even bigger numbers */
    @media(min-width:1200px){
      .orange-number{
        top:15px;
        right:15px;
        min-width:60px;
        width:60px;
        height:38px;
        font-size:17px;
      }
    }

    @media(min-width:1600px){
      .orange-number{
        top:18px;
        right:18px;
        min-width:66px;
        width:66px;
        height:42px;
        font-size:19px;
      }
    }

    .hover-preview{
      position:absolute;
      inset:5%;
      border-radius:50%;
      overflow:hidden;
      opacity:0;
      transform:scale(0.8);
      transition:all 0.3s ease;
      z-index:2;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .hover-preview iframe{
      width:200%;
      height:200%;
      border:none;
      transform:scale(0.5);
      transform-origin:center;
    }

    .connection-lines{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:1;
    }

    .orange-content{
      text-align:center;
      padding:20px;
      position:relative;
      z-index:2;
    }

    .orange-name{
      font-size:12px;
      font-weight:600;
      margin-bottom:4px;
      overflow:hidden;
      text-overflow:ellipsis;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
    }

    .orange-meta{
      font-size:10px;
      color:rgba(255,255,255,0.7);
    }

    /* Expanded view */
    .expanded{
      position:fixed;
      inset:80px 20px 20px;
      background:rgba(26,26,26,0.98);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,107,53,0.3);
      border-radius:12px;
      z-index:200;
      display:none;
      overflow:hidden;
    }
    .expanded.open{display:flex}

    .expanded-sidebar{
      width:280px;
      border-right:1px solid rgba(255,107,53,0.2);
      padding:25px;
      overflow-y:auto;
    }

    .expanded-main{
      flex:1;
      display:flex;
      flex-direction:column;
    }

    .expanded-header{
      padding:20px 25px;
      border-bottom:1px solid rgba(255,107,53,0.2);
      display:flex;
      justify-content:space-between;
      align-items:start;
    }

    .expanded-title{
      font-size:20px;
      font-weight:600;
      color:var(--accent);
      margin-bottom:10px;
    }

    .expanded-content{
      flex:1;
      overflow:auto;
      padding:15px;
      display:flex;
      flex-direction:column;
    }

    .close-expanded{
      background:none;
      border:none;
      color:var(--muted);
      font-size:28px;
      cursor:pointer;
      line-height:1;
      padding:0;
    }
    .close-expanded:hover{color:var(--accent)}

    /* File ripples */
    .file-ripples{
      margin-top:20px;
    }

    .file-ripple-title{
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:1px;
      color:var(--muted);
      margin-bottom:15px;
    }

    .file-ripple{
      display:inline-block;
      margin:5px;
      padding:8px 14px;
      background:rgba(255,107,53,0.1);
      border:1px solid rgba(255,107,53,0.3);
      border-radius:20px;
      font-size:11px;
      cursor:pointer;
      transition:all 0.2s;
    }
    .file-ripple:hover{
      background:rgba(255,107,53,0.3);
      transform:scale(1.05);
    }

    /* Iframe preview */
    .iframe-preview{
      width:100%;
      flex:1;
      min-height:0;
      border:1px solid rgba(255,107,53,0.2);
      border-radius:4px;
      background:#fff;
    }

    .preview-actions{
      margin-top:15px;
      display:flex;
      gap:10px;
    }

    .action-btn{
      padding:8px 16px;
      background:var(--accent);
      color:#000;
      text-decoration:none;
      border-radius:6px;
      font-weight:600;
      font-size:12px;
      border:none;
      cursor:pointer;
      transition:transform 0.2s;
    }
    .action-btn:hover{transform:translateY(-2px)}
    .action-btn.secondary{
      background:transparent;
      border:1px solid var(--accent);
      color:var(--accent);
    }

    /* Stats */
    .stats-grid{
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:15px;
      margin-bottom:20px;
    }

    .stat-card{
      background:rgba(255,107,53,0.1);
      padding:12px;
      border-radius:8px;
      border:1px solid rgba(255,107,53,0.2);
    }

    .stat-label{
      font-size:10px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:0.5px;
    }

    .stat-value{
      font-size:18px;
      font-weight:700;
      color:var(--accent);
      margin-top:4px;
    }

    /* Legend */
    .legend{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      background:rgba(10,10,10,0.95);
      backdrop-filter:blur(20px);
      border:2px solid var(--accent);
      border-radius:12px;
      padding:30px;
      z-index:400;
      opacity:0;
      animation:fadeInLegend 0.5s ease forwards 1s;
      max-width:400px;
    }

    @keyframes fadeInLegend{
      to{opacity:1}
    }

    .legend.hidden{display:none}

    .legend-title{
      font-size:20px;
      font-weight:700;
      color:var(--accent);
      margin-bottom:20px;
      text-align:center;
    }

    .legend-items{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .legend-item{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .legend-dot{
      width:12px;
      height:12px;
      border-radius:50%;
      flex-shrink:0;
    }

    .legend-label{
      font-size:13px;
      flex:1;
    }

    .legend-close{
      margin-top:20px;
      width:100%;
      padding:10px;
      background:var(--accent);
      color:#000;
      border:none;
      border-radius:6px;
      font-weight:700;
      cursor:pointer;
    }

    #loading{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      z-index:300;
    }

    #loading.hidden{display:none}

    .spinner{
      width:50px;
      height:50px;
      border:3px solid rgba(255,107,53,0.2);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(255,107,53,0.3);border-radius:4px}

    /* ── PROGRAM THEORY: Orange Strip ── */
    #pt-strip{
      padding:12px 20px 10px;
      border-bottom:1px solid rgba(255,107,53,0.15);
      background:rgba(0,0,0,0.4);
    }
    .pt-header{
      display:flex;align-items:center;gap:8px;
      margin-bottom:8px;
    }
    .pt-label{
      font-size:9px;font-weight:700;
      text-transform:uppercase;letter-spacing:1.5px;
      color:var(--accent);
    }
    .pt-count{
      font-size:8px;font-weight:600;
      color:var(--muted);opacity:0.4;
    }
    .pt-archive-link{
      font-size:7px;font-weight:700;
      text-transform:uppercase;letter-spacing:0.6px;
      padding:3px 8px;
      border:1px solid rgba(255,107,53,0.3);
      color:var(--accent);text-decoration:none;
      border-radius:3px;
      transition:all 0.15s;
      margin-left:auto;
    }
    .pt-archive-link:hover{
      background:var(--accent);color:#000;
    }
    .pt-grove{
      display:flex;
      gap:8px;
      overflow-x:auto;
      overflow-y:hidden;
      padding-bottom:6px;
      scroll-behavior:smooth;
      scroll-snap-type:x proximity;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%);
      -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%);
    }
    .pt-grove::-webkit-scrollbar{display:none}

    /* Individual orange assembly */
    .pt-orange{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 14px 6px 6px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.06);
      background:rgba(255,255,255,0.03);
      cursor:pointer;
      transition:all 0.25s ease;
      white-space:nowrap;
      scroll-snap-align:start;
    }
    .pt-orange:hover{
      border-color:rgba(255,107,53,0.4);
      transform:translateY(-2px);
      box-shadow:0 4px 16px rgba(0,0,0,0.3);
    }

    .pt-orb{
      position:relative;
      width:56px;height:56px;
      flex:0 0 56px;
    }
    .pt-orb svg{
      width:100%;height:100%;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4));
      transition:filter 0.25s;
    }
    .pt-orange:hover .pt-orb svg{
      filter:drop-shadow(0 4px 12px var(--hover-glow, rgba(255,107,53,0.5)));
    }

    /* Whole state */
    .pt-whole{transition:opacity 0.25s}
    .pt-orange:hover .pt-whole{opacity:0}

    /* Sliced state */
    .pt-sliced{opacity:0;transition:opacity 0.25s}
    .pt-orange:hover .pt-sliced{opacity:1}

    /* Density badge */
    .pt-badge{
      position:absolute;top:-3px;right:-3px;
      background:rgba(0,0,0,0.85);
      color:var(--accent);
      font-size:7px;font-weight:700;
      padding:1px 4px;
      border-radius:4px;
      letter-spacing:0.2px;
      pointer-events:none;
      z-index:3;
      line-height:1.3;
      border:1px solid rgba(255,107,53,0.2);
    }

    .pt-info{
      display:flex;flex-direction:column;
    }
    .pt-name{
      font-size:11px;font-weight:600;
      line-height:1.2;
      color:var(--text);
    }
    .pt-kicker{
      font-size:7px;font-weight:600;
      text-transform:uppercase;letter-spacing:0.6px;
      color:var(--muted);opacity:0.45;
      margin-top:2px;
    }

    /* Separator line between PT and grid */
    .pt-divider{
      height:1px;
      background:linear-gradient(90deg,transparent 0%,rgba(255,107,53,0.2) 20%,rgba(255,107,53,0.2) 80%,transparent 100%);
      margin:0;
    }

    /* ── IFRAME MODAL ── */
    #cake-modal{
      position:fixed;inset:0;
      z-index:500;
      display:none;
      align-items:stretch;
      justify-content:stretch;
    }
    #cake-modal.open{display:flex}
    #cake-modal-bg{
      position:absolute;inset:0;
      background:rgba(0,0,0,0.88);
      cursor:pointer;
    }
    #cake-modal-frame{
      position:relative;
      margin:40px;
      flex:1;
      display:flex;
      flex-direction:column;
      background:var(--panel);
      border:1px solid rgba(255,107,53,0.3);
      border-radius:10px;
      overflow:hidden;
      z-index:1;
    }
    #cake-modal-bar{
      display:flex;align-items:center;
      padding:8px 14px;
      background:rgba(0,0,0,0.6);
      border-bottom:1px solid rgba(255,107,53,0.2);
      gap:10px;
    }
    #cake-modal-title{
      font-size:13px;font-weight:600;
      color:var(--accent);flex:1;
    }
    #cake-modal-kicker{
      font-size:8px;font-weight:700;
      text-transform:uppercase;letter-spacing:0.8px;
      color:var(--muted);opacity:0.5;
    }
    #cake-modal-bar a{
      font-size:9px;font-weight:700;
      text-transform:uppercase;letter-spacing:0.5px;
      padding:4px 10px;
      border:1px solid rgba(255,107,53,0.4);
      color:var(--accent);text-decoration:none;
      border-radius:4px;
      transition:all 0.15s;
    }
    #cake-modal-bar a:hover{background:var(--accent);color:#000}
    #cake-modal-close{
      background:none;border:none;
      color:var(--muted);font-size:22px;
      cursor:pointer;padding:0 4px;
      line-height:1;
    }
    #cake-modal-close:hover{color:var(--accent)}
    #cake-modal-iframe{
      flex:1;width:100%;border:none;
      background:#0a0a0a;
    }
    @media(max-width:768px){
      #cake-modal-frame{margin:10px}
      .pt-grove{gap:6px}
      .pt-name{font-size:9px}
      .pt-orb{width:40px;height:40px;flex:0 0 40px}
      .pt-orange{padding:4px 10px 4px 4px}
      #pt-strip{padding:8px 12px 6px}
    }

    /* Timeline view */
    #timeline-view{
      display:none;
      padding:30px 20px;

      margin:0 auto;
    }
    #timeline-view.active{display:block}

    .timeline-header{
      text-align:center;
      margin-bottom:40px;
    }

    .timeline-title{
      font-size:24px;
      font-weight:700;
      color:var(--accent);
      margin-bottom:10px;
    }

    .timeline-range{
      color:var(--muted);
      font-size:14px;
    }

    .timeline{
      position:relative;
      padding:20px 0;
    }

    .timeline-line{
      position:absolute;
      left:50%;
      top:0;
      bottom:0;
      width:2px;
      background:linear-gradient(to bottom, var(--accent), var(--muted));
    }

    .timeline-year{
      margin:60px 0;
      position:relative;
    }

    .year-label{
      text-align:center;
      font-size:32px;
      font-weight:900;
      color:var(--accent);
      margin-bottom:20px;
      text-shadow:0 0 20px rgba(255,107,53,0.5);
    }

    .timeline-month{
      position:relative;
      margin:40px 0;
    }

    .month-label{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      background:var(--bg);
      padding:8px 16px;
      border-radius:20px;
      border:2px solid var(--accent);
      font-weight:600;
      font-size:14px;
      z-index:2;
    }

    .timeline-repos{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-top:50px;
    }

    .timeline-repo{
      position:relative;
      padding:20px;
      background:rgba(26,26,26,0.8);
      border:1px solid rgba(255,107,53,0.3);
      border-radius:12px;
      cursor:pointer;
      transition:all 0.3s;
    }

    .timeline-repo:nth-child(odd){
      justify-self:end;
      text-align:right;
    }

    .timeline-repo:nth-child(even){
      justify-self:start;
    }

    .timeline-repo:hover{
      transform:scale(1.05);
      border-color:var(--accent);
      box-shadow:0 4px 20px rgba(255,107,53,0.3);
    }

    .timeline-repo-name{
      font-weight:700;
      font-size:16px;
      margin-bottom:8px;
    }

    .timeline-repo-date{
      font-size:11px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .timeline-repo-meta{
      display:flex;
      gap:10px;
      font-size:11px;
      color:var(--muted);
      margin-top:10px;
    }

    .timeline-repo:nth-child(odd) .timeline-repo-meta{
      justify-content:flex-end;
    }

    .timeline-dot{
      position:absolute;
      top:50%;
      width:16px;
      height:16px;
      background:var(--accent);
      border:3px solid var(--bg);
      border-radius:50%;
      z-index:3;
    }

    .timeline-repo:nth-child(odd) .timeline-dot{
      right:-58px;
    }

    .timeline-repo:nth-child(even) .timeline-dot{
      left:-58px;
    }

    @media(max-width:1024px){
      .timeline-repos{
        grid-template-columns:1fr;
        gap:30px;
      }
      
      .timeline-repo:nth-child(odd),
      .timeline-repo:nth-child(even){
        justify-self:stretch;
        text-align:left;
        margin-left:40px;
      }
      
      .timeline-repo .timeline-dot{
        left:-28px !important;
        right:auto !important;
      }
      
      .timeline-repo-meta{
        justify-content:flex-start !important;
      }
      
      .timeline-line{
        left:0;
      }
    }

    @media(max-width:768px){
      .expanded{inset:80px 10px 10px}
      .expanded-sidebar{display:none}
      .grid{grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:15px}
    }

    @media(max-width:768px){
      #main{top:120px}
      header{padding:10px 15px}
      .expanded{inset:0 !important;border-radius:0;border:none}
      .expanded-sidebar{display:none}
      .expanded-header{padding:12px 16px}
      .expanded-content{padding:8px}
      .preview-actions{padding:0 8px 8px}
      .grid{grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:15px}
      .timeline-view{padding:20px 10px}
      .year-label{font-size:24px}
      .timeline-repo{padding:15px;font-size:13px}
    }

    @media(max-width:480px){
      .grid{grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));gap:12px}
      .orange-content{padding:12px}
      .orange-name{font-size:11px}
      .orange-meta{font-size:9px}
      .orange-number{
        min-width:40px;
        width:40px;
        height:26px;
        font-size:12px;
        top:8px;
        right:8px;
      }
    }

    /* Mobile: tap number to preview */
    @media (max-width: 768px){
      .orange.show-preview{
        transform:scale(1.05);
        z-index:50;
      }
      
      .orange-number::after{
        content:'👁';
        position:absolute;
        bottom:-4px;
        right:-4px;
        font-size:12px;
        animation:pulse 2s ease-in-out infinite;
      }
      
      .orange.show-preview .orange-number::after{
        content:'✓';
        animation:none;
      }
    }
    
    @keyframes pulse{
      0%, 100%{ opacity:0.5; transform:scale(1); }
      50%{ opacity:1; transform:scale(1.2); }
    }

  <!-- Program Theory Orange Assemblies Loader -->
  <script>
  (function loadProgramTheory(){
    function boot(pt){
      const grove = document.getElementById('pt-grove');
      const strip = document.getElementById('pt-strip');
      const countEl = document.getElementById('pt-count');
      if(!grove || !pt || !pt.archive_tiers) return;

      const skipTiers = new Set(['legacy_worldmaking','public_theory','external_proof']);
      const nodes = [];
      pt.archive_tiers.forEach(tier=>{
        if(skipTiers.has(tier.tier_id)) return;
        tier.nodes.forEach(node=>{
          nodes.push({...node, _tierName:tier.tier_name, _tierColor:tier.color});
        });
      });

      nodes.sort((a,b)=>{
        const at = a.density?.touches||0, bt = b.density?.touches||0;
        return bt - at || (a.title||'').localeCompare(b.title||'');
      });

      countEl.textContent = nodes.length + ' instruments';

      nodes.forEach((node, idx)=>{
        const el = document.createElement('div');
        el.className = 'pt-orange';
        const tc = node._tierColor || '#ff6b35';
        el.style.setProperty('--hover-glow', tc + '80');
        el.style.background = `linear-gradient(135deg, ${tc}08 0%, transparent 60%)`;
        let badge = '';
        if(node.density?.touches){
          badge = node.density.touches + 't';
        } else if(node.density?.size_kb){
          const kb = node.density.size_kb;
          badge = kb >= 1000 ? (kb/1000|0)+'MB' : kb+'KB';
        }

        // SVG orange with tier-colored slices
        const sliceAngles = [0, 60, 120, 180, 240, 300];
        let slicePaths = '';
        sliceAngles.forEach((deg, i)=>{
          const a1 = (deg - 90) * Math.PI / 180;
          const a2 = ((deg + 60) - 90) * Math.PI / 180;
          const x1 = 50 + 38 * Math.cos(a1);
          const y1 = 50 + 38 * Math.sin(a1);
          const x2 = 50 + 38 * Math.cos(a2);
          const y2 = 50 + 38 * Math.sin(a2);
          slicePaths += `<path d="M50,50 L${x1},${y1} A38,38 0 0,1 ${x2},${y2} Z" fill="${i%2===0 ? tc : 'rgba(255,255,255,0.08)'}" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"/>`;
        });

        el.innerHTML = `
          <div class="pt-orb">
            ${badge ? '<div class="pt-badge">'+badge+'</div>' : ''}
            <svg viewBox="0 0 100 100">
              <!-- Whole state -->
              <g class="pt-whole">
                <circle cx="50" cy="50" r="42" fill="${tc}" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>
                <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
                <ellipse cx="38" cy="38" rx="12" ry="8" fill="rgba(255,255,255,0.15)" transform="rotate(-30 38 38)"/>
              </g>
              <!-- Sliced state -->
              <g class="pt-sliced">
                <circle cx="50" cy="50" r="42" fill="rgba(40,40,40,0.9)" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
                ${slicePaths}
                <circle cx="50" cy="50" r="10" fill="${tc}" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
              </g>
            </svg>
          </div>
          <div class="pt-info">
            <div class="pt-name">${node.title}</div>
            <div class="pt-kicker">${node.kicker || ''}</div>
          </div>
        `;

        el.addEventListener('click', ()=> openCakeModal(node));
        grove.appendChild(el);
      });

      strip.style.display = 'block';
    }

    // Data is inline — always available, no fetch/CORS needed
    boot(window.__PT_DATA);

    // Modal logic
    const modal = document.getElementById('cake-modal');
    const modalBg = document.getElementById('cake-modal-bg');
    const modalClose = document.getElementById('cake-modal-close');
    const modalIframe = document.getElementById('cake-modal-iframe');
    const modalTitle = document.getElementById('cake-modal-title');
    const modalKicker = document.getElementById('cake-modal-kicker');
    const modalOpen = document.getElementById('cake-modal-open');
    const modalRepo = document.getElementById('cake-modal-repo');

    function openCakeModal(node){
      modalTitle.textContent = node.title;
      if(modalKicker) modalKicker.textContent = node.kicker || '';
      modalIframe.src = node.url || '';
      modalOpen.href = node.url || '#';
      if(node.repo){
        modalRepo.href = node.repo;
        modalRepo.style.display = '';
      } else {
        modalRepo.style.display = 'none';
      }
      modal.classList.add('open');
    }
    window.openCakeModal = openCakeModal;

    function closeCakeModal(){
      modal.classList.remove('open');
      modalIframe.src = '';
    }

    modalBg.addEventListener('click', closeCakeModal);
    modalClose.addEventListener('click', closeCakeModal);
    document.addEventListener('keydown', e=>{
      if(e.key==='Escape' && modal.classList.contains('open')) closeCakeModal();
    });
  })();
  </script>

  <script>
    let data = null;
    let canvas, ctx;
    let repos = [];

    let zoomLevel = 'md'; // sm, md, lg, xl
    let currentFilter = {theme: 'all', lang: 'all', sort: 'touches', search: ''};
    let showConnections = false;
    let filteredRepos = [];
    let repoIndex = 0;
    let auditLookup = {};

    // Ripple class (for canvas view)
    class Ripple{
      constructor(x, y, color){
        this.x = x;
        this.y = y;
        this.radius = 0;
        this.maxRadius = 100;
        this.color = color;
        this.opacity = 1;
        this.speed = 2;
      }
      
      update(){
        this.radius += this.speed;
        this.opacity = 1 - (this.radius / this.maxRadius);
        return this.radius < this.maxRadius;
      }
      
      draw(ctx){
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = this.color + Math.floor(this.opacity * 255).toString(16).padStart(2, '0');
        ctx.lineWidth = 3;
        ctx.stroke();
      }
    }

    // Repo class (for canvas view)
    class Repo{
      constructor(data, x, y, radius, color, number){
        this.data = data;
        this.x = x;
        this.y = y;
        this.targetX = x;
        this.targetY = y;
        this.radius = radius;
        this.baseRadius = radius;
        this.color = color;
        this.pulse = 0;
        this.hovered = false;
        this.number = number;
      }
      
      update(){
        this.x += (this.targetX - this.x) * 0.1;
        this.y += (this.targetY - this.y) * 0.1;
        this.pulse += 0.05;
        this.radius = this.baseRadius + Math.sin(this.pulse) * (this.hovered ? 3 : 1);
      }
      
      draw(ctx){
        ctx.save();
        ctx.shadowColor = this.color;
        ctx.shadowBlur = this.hovered ? 20 : 10;
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        
        const grad = ctx.createRadialGradient(
          this.x - this.radius * 0.3, this.y - this.radius * 0.3, 0,
          this.x, this.y, this.radius
        );
        grad.addColorStop(0, this.color + 'ff');
        grad.addColorStop(0.7, this.color + 'cc');
        grad.addColorStop(1, this.color + '88');
        
        ctx.fillStyle = grad;
        ctx.fill();
        
        // Highlight
        ctx.beginPath();
        ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fill();
        
        ctx.restore();
        
        // Draw number badge - standardized for 3 digits
        if(this.number){
          ctx.save();
          
          // Pill-shaped background
          const badgeWidth = 22;
          const badgeHeight = 14;
          const badgeX = this.x;
          const badgeY = this.y - this.radius * 0.6;
          
          ctx.beginPath();
          ctx.roundRect(badgeX - badgeWidth/2, badgeY - badgeHeight/2, badgeWidth, badgeHeight, badgeHeight/2);
          ctx.fillStyle = 'rgba(255,255,255,0.15)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.3)';
          ctx.lineWidth = 1;
          ctx.stroke();
          
          ctx.font = '700 11px "SF Mono", "Monaco", monospace';
          ctx.fillStyle = '#000';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(255,255,255,0.5)';
          ctx.shadowBlur = 2;
          ctx.fillText(this.number, badgeX, badgeY);
          ctx.restore();
        }
        
        if(this.hovered){
          ctx.font = '600 11px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = '#fff';
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 4;
          const name = this.data.name.length > 20 ? this.data.name.substring(0, 18) + '...' : this.data.name;
          ctx.fillText(name, this.x, this.y + this.radius + 15);
        }
      }
      
      contains(x, y){
        const dx = x - this.x;
        const dy = y - this.y;
        return dx * dx + dy * dy <= this.radius * this.radius;
      }
    }

    function init(){
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');
      resize();
      window.addEventListener('resize', resize);
      setupEvents();
      loadData();
    }

    function resize(){
      if(canvas.offsetWidth && canvas.offsetHeight){
        canvas.width = canvas.offsetWidth * window.devicePixelRatio;
        canvas.height = canvas.offsetHeight * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }
    }

    async function loadData(){
      try{
        const [themeResp, auditResp] = await Promise.all([
          fetch('github-thematic-index.json'),
          fetch('genome-patches.json').catch(()=>null)
        ]);
        data = await themeResp.json();

        // Build audit lookup from genome patches
        if(auditResp && auditResp.ok){
          const gp = await auditResp.json();
          gp.patches.forEach(p => {
            auditLookup[p.repo_name] = {
              touches: p.creator_trail_genome.authored_touches || 0,
              maturity: p.timeline_genome.maturity_stage,
              primary_organ: p.creator_trail_genome.primary_organ || '',
              making_pattern: p.creator_trail_genome.making_pattern || '',
            };
          });
          // Attach audit data to all repos in theme_rings
          data.theme_rings.forEach(theme => {
            theme.repos.forEach(repo => {
              const a = auditLookup[repo.name] || {};
              repo._touches = a.touches || 0;
              repo._maturity = a.maturity || '';
              repo._organ = a.primary_organ || '';
              repo._pattern = a.making_pattern || '';
            });
          });
        }

        document.getElementById('count').textContent = data.summary.total_repos;
        
        // Populate filter dropdowns
        populateFilters();
        
        // Create minimap
        createMinimap();
        
        // Create and show legend
        createLegend();
        
        // Create initial views
        applyFiltersAndSort();
        createCanvasRepos();
        document.getElementById('loading').classList.add('hidden');
        animate();
      }catch(err){
        console.error('Failed to load:', err);
        const isFile = location.protocol === 'file:';
        document.getElementById('loading').innerHTML = isFile
          ? '<div style="color:var(--accent);text-align:center;padding:40px"><div style="font-size:14px;font-weight:700;margin-bottom:8px">311 REPOS NEED HTTP</div><div style="font-size:11px;color:#888;max-width:360px;margin:0 auto;line-height:1.5">The repository grid requires an HTTP server to load data files.<br><code style="background:rgba(255,107,53,0.15);padding:2px 6px;border-radius:3px">python3 -m http.server 8080</code><br><br>The <b>Program Theory</b> section above works on file:// protocol.<br>On <b>GitHub Pages</b>, everything loads automatically.</div></div>'
          : '<div style="color:#888">Failed to load data<br><small>Run: python3 analyze-themes.py</small></div>';
      }
    }

    // Theme descriptions
    const themeDescriptions = {
      'media-theory': 'McLuhan, media ecology, and communication theory projects',
      'ai-ml': 'Artificial intelligence, machine learning, and neural networks',
      'web-dev': 'Web development, frameworks, and frontend technologies',

    function populateFilters(){
      const themeSelect = document.getElementById('filter-theme');
      const langSelect = document.getElementById('filter-lang');
      const mobileThemeList = document.getElementById('mobile-theme-list');

      const languages = new Set();

    function applyFiltersAndSort(){
      // Flatten all repos
      let allRepos = [];
      data.theme_rings.forEach(theme => {
        theme.repos.forEach(repo => {
          allRepos.push({...repo, theme: theme, themeColor: theme.color});
        });
      });
      
      // Apply filters
      filteredRepos = allRepos.filter(repo => {
        if(currentFilter.theme !== 'all' && repo.theme.theme_id !== currentFilter.theme) return false;
        if(currentFilter.lang !== 'all' && repo.language !== currentFilter.lang) return false;
        if(currentFilter.search){
          const q = currentFilter.search.toLowerCase();
          const hay = `${repo.name} ${repo.description||''} ${repo._maturity||''}`.toLowerCase();
          if(!hay.includes(q)) return false;
        }
        return true;
      });
      
      // Apply sorting
      switch(currentFilter.sort){
        case 'touches':
          filteredRepos.sort((a, b) => {
            if(a.quarantined && !b.quarantined) return 1;
            if(!a.quarantined && b.quarantined) return -1;
            return (b._touches||0) - (a._touches||0);
          });
          break;
        case 'created':
          filteredRepos.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          break;
        case 'oldest':
          filteredRepos.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
          break;
        case 'size':
          filteredRepos.sort((a, b) => b.size_kb - a.size_kb);
          break;
        case 'updated':
          filteredRepos.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
          break;
        case 'name':
          filteredRepos.sort((a, b) => a.name.localeCompare(b.name));
          break;
        case 'theme':
        default:
          // Already grouped by theme
          break;
      }
      
      document.getElementById('count').textContent = filteredRepos.length;
      createGridView();
      if(currentView === 'timeline'){
        createTimelineView();
      }
    }

    function setupViewportIndicator(){
      const mainEl = document.getElementById('main');
      const indicator = document.getElementById('viewport-indicator');
      const minimapGrid = document.getElementById('minimap-grid');
      
      function updateViewportIndicator(){
        if(currentView !== 'grid') {
          indicator.style.display = 'none';
          return;
        }
        
        indicator.style.display = 'block';
        
        const oranges = document.querySelectorAll('.orange');
        if(!oranges.length) return;
        
        // Calculate which oranges are visible
        const scrollTop = mainEl.scrollTop;
        const viewportHeight = mainEl.clientHeight;
        const scrollBottom = scrollTop + viewportHeight;
        
        let firstVisible = -1;
        let lastVisible = -1;
        
        oranges.forEach((orange, idx) => {
          const rect = orange.getBoundingClientRect();
          const orangeTop = orange.offsetTop;
          const orangeBottom = orangeTop + orange.offsetHeight;
          
          if(orangeBottom >= scrollTop && orangeTop <= scrollBottom){
            if(firstVisible === -1) firstVisible = idx;
            lastVisible = idx;
          }
        });
        
        if(firstVisible === -1) return;
        
        // Get minimap dots positions
        const dots = minimapGrid.querySelectorAll('.minimap-dot');
        if(!dots.length) return;
        
        const firstDot = dots[firstVisible];
        const lastDot = dots[lastVisible];
        
        if(!firstDot || !lastDot) return;
        
        // Get all visible dots to find bounding box
        const visibleDots = Array.from(dots).slice(firstVisible, lastVisible + 1);
        const gridRect = minimapGrid.getBoundingClientRect();
        
        // Find min/max coordinates across all visible dots
        let minLeft = Infinity, minTop = Infinity;
        let maxRight = -Infinity, maxBottom = -Infinity;
        
        visibleDots.forEach(dot => {
          const rect = dot.getBoundingClientRect();
          minLeft = Math.min(minLeft, rect.left);
          minTop = Math.min(minTop, rect.top);
          maxRight = Math.max(maxRight, rect.right);
          maxBottom = Math.max(maxBottom, rect.bottom);
        });
        
        // Position relative to grid
        const left = minLeft - gridRect.left - 2;
        const top = minTop - gridRect.top - 2;
        const width = maxRight - minLeft + 4;
        const height = maxBottom - minTop + 4;
        
        indicator.style.left = `${left}px`;
        indicator.style.top = `${top}px`;
        indicator.style.width = `${width}px`;
        indicator.style.height = `${height}px`;
      }
      
      // Update on scroll
      mainEl.addEventListener('scroll', updateViewportIndicator);
      
      // Update on resize
      window.addEventListener('resize', updateViewportIndicator);
      
      // Initial update
      setTimeout(updateViewportIndicator, 500);
    }

    function injectPreviewIframe(orange){
      const url = orange.dataset.previewUrl;
      if(!url) return;
      let container = orange.querySelector('.hover-preview');
      if(!container){
        container = document.createElement('div');
        container.className = 'hover-preview';

        const content = orange.querySelector('.orange-content');
        orange.insertBefore(container, content);
      }
      // Only create iframe if not already present
      if(!container.querySelector('iframe')){
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.loading = 'lazy';
        // Sandbox: block camera, mic, vibrate, popups, autoplay
        iframe.sandbox = 'allow-scripts allow-same-origin';
        iframe.allow = "autoplay 'none'; camera 'none'; microphone 'none'";
        container.appendChild(iframe);
      }
    }

    function removePreviewIframe(orange){
      const container = orange.querySelector('.hover-preview');
      if(container){

        if(iframe){

          iframe.remove();
        }
      }

          // Mobile: number badge toggles preview

            document.querySelectorAll('.orange.show-preview').forEach(o => {
              if(o !== orange){

                removePreviewIframe(o);
              }
            });

            const showing = orange.classList.toggle('show-preview');

            }

        } else {
          // Desktop: create iframe on hover, destroy on leave
          orange.addEventListener('mouseenter', () => {
            // Destroy previous if any
            if(activePreviewOrange && activePreviewOrange !== orange){
              removePreviewIframe(activePreviewOrange);
            }
            injectPreviewIframe(orange);
            activePreviewOrange = orange;
          });
          
          orange.addEventListener('mouseleave', () => {
            removePreviewIframe(orange);
            if(activePreviewOrange === orange) activePreviewOrange = null;
          });
          
          // Desktop: clicking anywhere opens expanded view
          orange.addEventListener('click', () => {
            showExpanded(repo, repo.theme);
            // Highlight in minimap
            const dots = document.querySelectorAll('.minimap-dot');
            dots.forEach(d => d.classList.remove('active'));
            if(dots[idx]) dots[idx].classList.add('active');
          });
        }
        
        grid.appendChild(orange);
      });
      
      // Close preview when clicking outside on mobile
      const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
      if(isMobileDevice){
        // Remove existing listener if any
        document.removeEventListener('click', closePreviewsHandler);
        document.addEventListener('click', closePreviewsHandler);
      }
    }

    function createTimelineView(){
      const container = document.getElementById('timeline-container');
      container.innerHTML = '<div class="timeline-line"></div>';
      
      // Group repos by year and month
      const byYearMonth = {};
      filteredRepos.forEach(repo => {
        const date = new Date(repo.created_at);
        const year = date.getFullYear();
        const month = date.getMonth();
        
        if(!byYearMonth[year]) byYearMonth[year] = {};
        if(!byYearMonth[year][month]) byYearMonth[year][month] = [];
        byYearMonth[year][month].push(repo);
      });
      
      // Get date range
      const dates = filteredRepos.map(r => new Date(r.created_at));
      const minDate = new Date(Math.min(...dates));
      const maxDate = new Date(Math.max(...dates));
      document.getElementById('timeline-range').textContent = 
        `${minDate.toLocaleDateString('en-US', {month: 'long', year: 'numeric'})} — ${maxDate.toLocaleDateString('en-US', {month: 'long', year: 'numeric'})}`;
      
      // Sort years descending (most recent first)
      const years = Object.keys(byYearMonth).sort((a, b) => b - a);
      
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
      
      years.forEach(year => {
        const yearSection = document.createElement('div');
        yearSection.className = 'timeline-year';
        yearSection.innerHTML = `<div class="year-label">${year}</div>`;
        
        // Sort months descending
        const months = Object.keys(byYearMonth[year]).sort((a, b) => b - a);
        
        months.forEach(month => {
          const monthSection = document.createElement('div');
          monthSection.className = 'timeline-month';
          monthSection.innerHTML = `<div class="month-label">${monthNames[month]}</div>`;
          
          const reposContainer = document.createElement('div');
          reposContainer.className = 'timeline-repos';
          
          // Sort repos by date within month
          byYearMonth[year][month]
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
            .forEach(repo => {
              const repoEl = document.createElement('div');
              repoEl.className = 'timeline-repo';
              repoEl.style.borderLeftColor = repo.themeColor;
              
              const date = new Date(repo.created_at);
              const dateStr = date.toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'});
              
              repoEl.innerHTML = `
                <div class="timeline-dot" style="background:${repo.themeColor}"></div>
                <div class="timeline-repo-name" style="color:${repo.themeColor}">${repo.name}</div>
                <div class="timeline-repo-date">${dateStr}</div>
                <div style="font-size:12px;color:var(--muted);margin:8px 0">${repo.description || 'No description'}</div>
                <div class="timeline-repo-meta">
                  <span>${repo.language || '—'}</span>
                  <span>⭐ ${repo.stars}</span>
                  <span>${(repo.size_kb/1024).toFixed(1)}MB</span>
                </div>
              `;
              
              repoEl.addEventListener('click', () => showExpanded(repo, repo.theme));
              reposContainer.appendChild(repoEl);
            });
          
          monthSection.appendChild(reposContainer);
          yearSection.appendChild(monthSection);
        });
        
        container.appendChild(yearSection);
      });
    }

    function createCanvasRepos(){
      repos = [];
      const w = canvas.offsetWidth || window.innerWidth;
      const h = canvas.offsetHeight || window.innerHeight - 60;
      
      let number = 0;
      data.theme_rings.forEach((theme, themeIdx) => {
        const angle = (themeIdx / data.theme_rings.length) * Math.PI * 2;
        const distance = Math.min(w, h) * 0.32; // Even more spread
        const clusterX = w/2 + Math.cos(angle) * distance;
        const clusterY = h/2 + Math.sin(angle) * distance;
        
        theme.repos.forEach((repoData, repoIdx) => {
          number++;
          const baseSize = 16 + Math.random() * 12; // Bigger balls
          const localAngle = (repoIdx / theme.repos.length) * Math.PI * 2 * 2.2;
          const localDist = (repoIdx % 7) * 40 + Math.random() * 30; // Much better spacing
          const x = clusterX + Math.cos(localAngle) * localDist;
          const y = clusterY + Math.sin(localAngle) * localDist;
          
          repos.push(new Repo(repoData, x, y, baseSize, theme.color, number));
        });
      });
    }

    function animate(){
      if(currentView === 'ripple'){
        const w = canvas.offsetWidth;

        ctx.clearRect(0, 0, w, h);

          r.update();
          r.draw(ctx);
          return r.radius < r.maxRadius;
        });
        
        repos.forEach(repo => {
          repo.update();
          repo.draw(ctx);
        });
      }
      
      requestAnimationFrame(animate);
    }

        document.getElementById('canvas-view').classList.remove('active');
        document.getElementById('timeline-view').classList.remove('active');
        document.getElementById('view-grid').classList.add('active');
        document.getElementById('view-ripple').classList.remove('active');
        document.getElementById('view-timeline').classList.remove('active');
      });

      document.getElementById('view-ripple').addEventListener('click', () => {
        currentView = 'ripple';
        document.getElementById('grid-view').classList.remove('active');
        document.getElementById('canvas-view').classList.add('active');
        document.getElementById('timeline-view').classList.remove('active');
        document.getElementById('view-grid').classList.remove('active');
        document.getElementById('view-ripple').classList.add('active');
        document.getElementById('view-timeline').classList.remove('active');
        resize();
      });

      document.getElementById('view-timeline').addEventListener('click', () => {
        currentView = 'timeline';
        document.getElementById('grid-view').classList.remove('active');
        document.getElementById('canvas-view').classList.remove('active');
        document.getElementById('timeline-view').classList.add('active');
        document.getElementById('view-grid').classList.remove('active');
        document.getElementById('view-ripple').classList.remove('active');
        document.getElementById('view-timeline').classList.add('active');
        createTimelineView();
      });

      // Filters
      document.getElementById('filter-theme').addEventListener('change', (e) => {
        currentFilter.theme = e.target.value;
        applyFiltersAndSort();
      });

      document.getElementById('filter-lang').addEventListener('change', (e) => {
        currentFilter.lang = e.target.value;
        applyFiltersAndSort();
      });

      document.getElementById('sort-by').addEventListener('change', (e) => {
        currentFilter.sort = e.target.value;
        applyFiltersAndSort();
      });

      // Search
      document.getElementById('search-repos').addEventListener('input', (e) => {
        currentFilter.search = e.target.value;
        applyFiltersAndSort();
      });

      // Zoom controls
      document.getElementById('zoom-in').addEventListener('click', () => {
        if(zoomLevel === 'sm') zoomLevel = 'md';
        else if(zoomLevel === 'md') zoomLevel = 'lg';
        else if(zoomLevel === 'lg') zoomLevel = 'xl';
        createGridView();
      });

      document.getElementById('zoom-out').addEventListener('click', () => {
        if(zoomLevel === 'xl') zoomLevel = 'lg';
        else if(zoomLevel === 'lg') zoomLevel = 'md';
        else if(zoomLevel === 'md') zoomLevel = 'sm';
        createGridView();
      });

      // Connections toggle
      document.getElementById('show-connections').addEventListener('click', (e) => {
        showConnections = !showConnections;
        e.target.classList.toggle('active');
        if(showConnections){
          drawConnections();
        } else {
          clearConnections();
        }
      });

      // Close expanded
      document.getElementById('close-expanded').addEventListener('click', () => {
        document.getElementById('expanded').classList.remove('open');
      });

      // Canvas events (ripple view)
      let isDragging = false;
      let dragStart = {x: 0, y: 0};

      canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        isDragging = true;
        dragStart = {x: e.clientX - rect.left, y: e.clientY - rect.top};
      });

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        if(isDragging){
          const dx = x - dragStart.x;
          const dy = y - dragStart.y;
          repos.forEach(repo => {
            repo.targetX += dx;
            repo.targetY += dy;
          });
          dragStart = {x, y};
        } else {
          repos.forEach(repo => {
            repo.hovered = repo.contains(x, y);
          });
        }
      });

      canvas.addEventListener('mouseup', () => {
        isDragging = false;
      });

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        repos.forEach(repo => {
          if(repo.contains(x, y)){
            ripples.push(new Ripple(repo.x, repo.y, repo.color));
            // Find theme for this repo
            let theme = null;
            data.theme_rings.forEach(t => {
              if(t.repos.includes(repo.data)) theme = t;
            });
            showExpanded(repo.data, theme);
          }
        });
      });
    }

    function findRepoConnections(repo1, repo2){
      // Calculate connection strength based on multiple factors
      let strength = 0;
      let reasons = [];
      
      // 1. Same theme (strong connection)
      if(repo1.theme.theme_id === repo2.theme.theme_id){
        strength += 3;
        reasons.push('Same theme');
      }
      
      // 2. Shared topics
      const topics1 = new Set(repo1.topics || []);
      const topics2 = new Set(repo2.topics || []);
      const sharedTopics = [...topics1].filter(t => topics2.has(t));
      if(sharedTopics.length > 0){
        strength += sharedTopics.length * 2;
        reasons.push(`${sharedTopics.length} shared topic(s)`);
      }
      
      // 3. Similar name patterns (kebab case similarity)
      const name1Parts = repo1.name.toLowerCase().split(/[-_]/);
      const name2Parts = repo2.name.toLowerCase().split(/[-_]/);
      const sharedWords = name1Parts.filter(p => name2Parts.includes(p) && p.length > 3);
      if(sharedWords.length > 0){
        strength += sharedWords.length;
        reasons.push(`Similar names`);
      }
      
      // 4. Description keywords
      if(repo1.description && repo2.description){
        const desc1 = repo1.description.toLowerCase().split(/\s+/);
        const desc2 = repo2.description.toLowerCase().split(/\s+/);
        const keywords = ['ai', 'media', 'interactive', 'visualization', 'tool', 'framework', 'app', '3d', 'vr'];
        const shared = keywords.filter(k => 
          desc1.some(d => d.includes(k)) && desc2.some(d => d.includes(k))
        );
        if(shared.length > 0){
          strength += shared.length * 1.5;
          reasons.push(`Shared concepts`);
        }
      }
      
      // 5. Same language (weaker connection)
      if(repo1.language && repo1.language === repo2.language){
        strength += 1;
        reasons.push('Same language');
      }
      
      // 6. Similar size (might indicate similar complexity)
      const sizeDiff = Math.abs(repo1.size_kb - repo2.size_kb);
      const avgSize = (repo1.size_kb + repo2.size_kb) / 2;
      if(avgSize > 0 && sizeDiff / avgSize < 0.3){
        strength += 0.5;
      }
      
      return {strength, reasons};
    }

    function drawConnections(){
      // Create SVG overlay
      let svg = document.getElementById('connection-svg');
      if(!svg){
        svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.id = 'connection-svg';
        svg.style.position = 'absolute';
        svg.style.inset = '0';
        svg.style.pointerEvents = 'none';
        svg.style.zIndex = '1';
        document.getElementById('grid-view').appendChild(svg);
      }
      
      const grid = document.getElementById('grid-container');
      const rect = grid.getBoundingClientRect();
      svg.setAttribute('width', rect.width);
      svg.setAttribute('height', rect.height);
      svg.innerHTML = '';
      
      // Get positions
      const oranges = grid.querySelectorAll('.orange');
      const repoPositions = Array.from(oranges).map((el, idx) => {
        const r = el.getBoundingClientRect();
        return {
          x: r.left + r.width/2 - rect.left,
          y: r.top + r.height/2 - rect.top,
          repo: filteredRepos[idx]
        };
      });
      
      // Find and draw meaningful connections
      let connectionsDrawn = 0;
      const maxConnections = 100; // Limit to prevent clutter
      
      repoPositions.forEach((pos1, i) => {
        repoPositions.slice(i+1).forEach((pos2) => {
          if(connectionsDrawn >= maxConnections) return;
          
          const connection = findRepoConnections(pos1.repo, pos2.repo);
          
          // Only draw if strength is above threshold
          if(connection.strength >= 3){
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', pos1.x);
            line.setAttribute('y1', pos1.y);
            line.setAttribute('x2', pos2.x);
            line.setAttribute('y2', pos2.y);
            
            // Visual encoding of connection strength
            const opacity = Math.min(connection.strength / 10, 0.6);
            const width = Math.min(connection.strength / 2, 3);
            
            line.setAttribute('stroke', pos1.repo.themeColor);
            line.setAttribute('stroke-width', width);
            line.setAttribute('stroke-opacity', opacity);
            line.setAttribute('stroke-dasharray', connection.strength > 5 ? '0' : '4,4');
            
            // Add tooltip
            const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
            title.textContent = `${pos1.repo.name} ↔ ${pos2.repo.name}\n${connection.reasons.join(', ')}`;
            line.appendChild(title);
            
            svg.appendChild(line);
            connectionsDrawn++;
          }
        });
      });
      
      // Show connection count
      console.log(`📊 Drew ${connectionsDrawn} meaningful connections`);
    }

    function clearConnections(){
      const svg = document.getElementById('connection-svg');
      if(svg) svg.remove();
    }

    init();
  </script>
