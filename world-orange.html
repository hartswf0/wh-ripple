<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Assemblies — Extraction Matrix</title>
    <style>
        :root {
            --bg: #FFE15D;
            --orange: #FF6A00;
            --seg-inner: #F99F2A;
            --border: #000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Space Grotesk', monospace;
            background: var(--bg);
            color: var(--border);
            overflow-x: hidden;
            cursor: crosshair;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- SCROLLBAR STYLING --- */
        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
            border-left: 2px solid var(--border);
            border-top: 2px solid var(--border);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--orange);
            border: 2px solid var(--border);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--seg-inner);
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--orange) var(--bg);
        }

        /* --- INTRO SEQUENCE --- */
        .intro {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2000;
            background: var(--bg);
            padding: 2rem;
            border-radius: 20px;
            border: 2px solid var(--border);
            max-width: 400px;
            transition: all 0.5s ease;
        }

        .intro.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.8);
        }

        .intro h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .intro p {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: bold;
            font-family: inherit;
            text-decoration: none;
            color: var(--border);
            background: var(--orange);
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            border: 2px solid var(--border);
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            transform: scale(1.05);
            background: var(--seg-inner);
        }

        .btn-external {
            background: var(--border);
            color: var(--bg);
        }

        .btn-external:hover {
            background: var(--orange);
            color: var(--border);
        }

        /* --- UNIFIED NAVIGATION HEADER --- */
        .nav-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem 2rem;
            background: var(--bg);
            border-bottom: 2px solid var(--border);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 1rem;
            height: 70px;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-grow: 1;
        }

        .btn-retract {
            background: var(--bg);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.8rem;
            display: none;
        }

        .btn-retract:hover {
            background: var(--border);
            color: var(--bg);
            transform: translateX(-3px);
        }

        .path-display {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- THE MATRIX (MAIN CONTAINER) --- */
        .matrix {
            padding: 100px 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        /* --- NODE GRID --- */
        .node-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 5rem 2rem;
            align-items: start;
        }

        /* --- UNIVERSAL NODE STYLING (ORANGES) --- */
        .node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s ease;
            text-align: center;
        }

        .node:hover {
            transform: scale(1.05);
        }

        .node-visual {
            position: relative;
            width: 160px;
            height: 160px;
        }

        .node-shadow {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 15px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            z-index: 0;
            transition: all 0.2s ease;
        }

        .node:hover .node-shadow {
            transform: translateX(-50%) scale(1.1);
        }

        .node-svg {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .node-label {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.3;
            max-width: 100%;
        }

        .node-sublabel {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 0.25rem;
        }

        /* --- LEVEL 1 METADATA BLOCK --- */
        .context-meta {
            background: transparent;
            border: 2px solid var(--border);
            padding: 2rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-start;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.1);
        }

        .context-meta h1 {
            font-size: 2rem;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .context-meta p {
            font-size: 1rem;
            line-height: 1.5;
            max-width: 800px;
        }

        /* --- LEVEL 2 VIEWER BLOCK --- */
        .extraction-viewer {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .extraction-viewer h2 {
            font-size: 1.5rem;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .extraction-viewer img {
            width: 100%;
            max-width: 800px;
            border: 2px solid var(--border);
            border-radius: 8px;
        }

        .extraction-viewer pre {
            background: #fff;
            padding: 1.5rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.85rem;
        }

        .extraction-viewer iframe {
            width: 100%;
            height: 70vh;
            min-height: 500px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: #fff;
        }

        .extraction-viewer p {
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 800px;
        }

        /* --- FRACTAL GRID SYSTEM --- */
        .fractal-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 2rem;
            height: 65vh;
            min-height: 450px;
            padding: 1rem;
            background: var(--orange);
            border: 2px solid var(--border);
            border-radius: 8px;
            overflow-x: auto;
            position: relative;
        }

        .fractal-col {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 60px;
            gap: 0;
            border: 2px solid var(--border);
            background: var(--bg);
        }

        .fractal-node {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--border);
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease, opacity 0.2s ease;
            user-select: none;
        }

        .fractal-node:last-child {
            border-bottom: none;
        }

        /* Trace Lineage States */
        .fractal-node.active-trace {
            background: var(--seg-inner);
            opacity: 1;
        }

        .fractal-node.trace-dimmed {
            opacity: 0.15;
            background: var(--bg);
        }

        @media (max-width: 768px) {
            .nav-header {
                padding: 1rem;
                height: 60px;
            }

            .matrix {
                padding: 80px 1rem 2rem;
                gap: 2rem;
            }

            .node-grid {
                gap: 3rem 1rem;
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            }

            .node-visual {
                width: 120px;
                height: 120px;
            }

            .context-meta {
                padding: 1.5rem;
            }

            .context-meta h1 {
                font-size: 1.5rem;
            }

            .fractal-container {
                gap: 0.5rem;
                height: 55vh;
            }

            .fractal-node {
                font-size: 0.6rem;
                min-height: 12px;
            }

            .path-display {
                font-size: 0.7rem;
            }
        }
    </style>
</head>

<body>
    <div class="intro" id="intro">
        <h1>Orange Assemblies</h1>
        <p>A high-potency citrus matrix for modular creativity. Dive into the root to extract the data.</p>
        <button class="btn-action" onclick="closeIntro()">INITIATE EXTRACTION</button>
    </div>

    <header class="nav-header">
        <div class="nav-controls">
            <button id="btn-retract" class="btn-action btn-retract" onclick="drillUp()">↤ RETRACT</button>
            <div id="path-display" class="path-display">ROOT</div>
        </div>
    </header>

    <main class="matrix" id="matrix"></main>

    <script>
        // --- SECURE DATA MODEL GENERATION ---
        // Generates an explicit, deeply nested hierarchical JSON structure mapped to the target layout.
        // No mathematical illusions. Pure tree traversal with parent-child links.
        function generateFractalTree() {
            let tree = [];
            let bCounter = 1; let nCounter = 1; let cCounter = 1;
            for (let d = 1; d <= 3; d++) {
                let dNode = { id: `D${d}`, label: `D${d}`, parent: null, children: [] };
                for (let c = 1; c <= 3; c++) {
                    let cNode = { id: `C${cCounter}`, label: `C${cCounter}`, parent: dNode.id, children: [] };
                    for (let b = 1; b <= 2; b++) {
                        let bNode = { id: `B${bCounter}`, label: `B${bCounter}`, parent: cNode.id, children: [] };
                        for (let n = 1; n <= 2; n++) {
                            bNode.children.push({ id: `N${nCounter}`, label: `${nCounter}`, parent: bNode.id, children: [] });
                            nCounter++;
                        }
                        cNode.children.push(bNode);
                        bCounter++;
                    }
                    dNode.children.push(cNode);
                    cCounter++;
                }
                tree.push(dNode);
            }
            return tree;
        }

        const projects = [
            {
                id: 1,
                title: "CODE PEEL",
                description: "Exploration into cellular automata for organic pattern generation. Simple rules combine to create complex, emergent behaviors.",
                url: "https://example.com/code-peel",
                segments: [
                    { id: "01", title: "Concept Overview", type: "text", content: "Exploration into cellular automata for organic pattern generation. We utilize heavily recursive functions to map state transformations across the grid." },
                    { id: "02", title: "Visual Output", type: "image", content: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23FFE15D'/%3E%3Crect x='50' y='50' width='100' height='100' fill='none' stroke='%23000' stroke-width='2'/%3E%3Cpath d='M50,50 L150,150 M150,50 L50,150' stroke='%23FF6A00' stroke-width='3'/%3E%3Ccircle cx='100' cy='100' r='20' fill='%23F99F2A'/%3E%3C/svg%3E" },
                    { id: "03", title: "Core Logic", type: "code", content: "function updateCell(grid, x, y) {\n  const neighbors = countLiveNeighbors(grid, x, y);\n  if (currentState === 1 && (neighbors < 2 || neighbors > 3)) return 0;\n  if (currentState === 0 && neighbors === 3) return 1;\n  return currentState;\n}" }
                ]
            },
            {
                id: 2,
                title: "SYNTH GROOVE",
                description: "A modular synthesizer interface built entirely with the Web Audio API. Connect cables between oscillators and filters in real-time.",
                url: "https://en.wikipedia.org/wiki/Modular_synthesizer",
                segments: [
                    { id: "01", title: "Architecture", type: "text", content: "The system relies on audio context nodes strictly connected via a directed acyclic graph. Gain nodes and oscillators represent the foundational blocks." },
                    { id: "02", title: "UI Schematic", type: "image", content: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23FFE15D'/%3E%3Crect x='20' y='20' width='160' height='160' fill='none' stroke='%23000' stroke-width='2'/%3E%3Ccircle cx='60' cy='60' r='25' fill='%23FF6A00'/%3E%3Ccircle cx='140' cy='60' r='25' fill='%23FF6A00'/%3E%3Crect x='40' y='120' width='120' height='40' fill='%23F99F2A' stroke='%23000' stroke-width='2'/%3E%3Cpath d='M60,85 L60,120 M140,85 L140,120' stroke='%23000' stroke-width='2'/%3E%3C/svg%3E" },
                    { id: "03", title: "Patch Example", type: "code", content: "const audioContext = new (window.AudioContext || window.webkitAudioContext)();\nconst oscillator = audioContext.createOscillator();\nconst gainNode = audioContext.createGain();\noscillator.connect(gainNode);\ngainNode.connect(audioContext.destination);\noscillator.start();" },
                    { id: "04", title: "Live Sandbox", type: "iframe", content: "https://en.wikipedia.org/wiki/Modular_synthesizer" }
                ]
            },
            {
                id: 3,
                title: "FRACTAL WORLDS",
                description: "An interactive structural grid simulating the fractal drill-down of complex organizational architectures and deep hierarchies.",
                url: "https://example.com/fractal",
                segments: [
                    { id: "01", title: "Theory", type: "text", content: "Information architecture requires moving from a high-level domain down into granular components. This matrix reads a genuine nested data tree, avoiding CSS illusions. Hover or Tap any node to explicitly trace its entire lineage up to the root and down to its leaves." },
                    { id: "02", title: "Interactive Matrix", type: "fractal", tree: generateFractalTree() }
                ]
            }
        ];

        /* --- STATE MANAGEMENT --- */
        let currentPath = []; 
        let globalAudioCtx = null; // Global Singleton to prevent memory leaks

        const matrixEl = document.getElementById('matrix');
        const pathDisplayEl = document.getElementById('path-display');
        const btnRetractEl = document.getElementById('btn-retract');

        function playClickSound(freq = 800) {
            try {
                if (!globalAudioCtx) {
                    globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (globalAudioCtx.state === 'suspended') {
                    globalAudioCtx.resume();
                }
                
                const oscillator = globalAudioCtx.createOscillator();
                const gainNode = globalAudioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(globalAudioCtx.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(freq, globalAudioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, globalAudioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, globalAudioCtx.currentTime + 0.15);
                
                oscillator.start(globalAudioCtx.currentTime);
                oscillator.stop(globalAudioCtx.currentTime + 0.15);
            } catch (e) { console.warn("Audio Context Locked"); }
        }

        function closeIntro() {
            document.getElementById('intro').classList.add('hidden');
            renderMatrix();
            // Initialize audio context safely on first user gesture
            playClickSound(1500); 
        }

        function drillDown(id) {
            currentPath.push(id);
            playClickSound(1000); 
            renderMatrix();
        }

        function drillUp() {
            if (currentPath.length > 0) {
                currentPath.pop();
                playClickSound(600); 
                renderMatrix();
            }
        }

        /* --- COMPONENT GENERATORS --- */
        function generateOrangeSVG(type) {
            if (type === 'whole') {
                return `
                    <svg class="node-svg" viewBox="0 0 200 200">
                        <circle cx="100" cy="100" r="90" fill="var(--orange)" stroke="var(--border)" stroke-width="4"/>
                    </svg>
                `;
            } else if (type === 'sliced') {
                let sliceLines = '';
                for (let i = 0; i < 6; i++) {
                    const angle = i * (360 / 6) * Math.PI / 180; 
                    const x1 = 100 + 20 * Math.cos(angle);
                    const y1 = 100 + 20 * Math.sin(angle);
                    const x2 = 100 + 90 * Math.cos(angle);
                    const y2 = 100 + 90 * Math.sin(angle);
                    sliceLines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--border)" stroke-width="4"/>`;
                }
                return `
                    <svg class="node-svg" viewBox="0 0 200 200">
                        <circle cx="100" cy="100" r="90" fill="var(--seg-inner)" stroke="var(--border)" stroke-width="4"/>
                        <circle cx="100" cy="100" r="20" fill="var(--orange)" stroke="var(--border)" stroke-width="4"/>
                        ${sliceLines}
                    </svg>
                `;
            }
        }

        function createNodeHtml(id, title, subtitle, svgType) {
            return `
                <div class="node" onclick="drillDown('${id}')">
                    <div class="node-visual">
                        <div class="node-shadow"></div>
                        ${generateOrangeSVG(svgType)}
                    </div>
                    <div class="node-label">
                        ${title}
                        ${subtitle ? `<div class="node-sublabel">${subtitle}</div>` : ''}
                    </div>
                </div>
            `;
        }

        function buildFractalHTML(treeData) {
            // Flatten the true hierarchical tree into columns for the layout engine
            const cols = [];
            function traverse(nodes, depth) {
                if (!cols[depth]) cols[depth] = [];
                nodes.forEach(node => {
                    cols[depth].push(node);
                    if (node.children && node.children.length > 0) traverse(node.children, depth + 1);
                });
            }
            traverse(treeData, 0);

            let html = '<div class="fractal-container" id="fractal-view" data-touch-locked="false" data-locked-node="">';
            cols.forEach((colNodes, depth) => {
                html += `<div class="fractal-col" data-level="${depth}">`;
                colNodes.forEach(node => {
                    // Inject explicit data attributes
                    html += `<div class="fractal-node" data-id="${node.id}" data-parent="${node.parent || 'null'}">${node.label}</div>`;
                });
                html += `</div>`;
            });
            html += '</div>';
            return html;
        }

        function setupFractalInteractions() {
            const container = document.getElementById('fractal-view');
            const nodes = container.querySelectorAll('.fractal-node');
            const nodesArr = Array.from(nodes);

            function getLineageSet(startNodeId) {
                const traceIds = new Set([startNodeId]);
                
                // 1. Traverse UP to the root
                let currentNode = nodesArr.find(n => n.getAttribute('data-id') === startNodeId);
                let currentParentId = currentNode ? currentNode.getAttribute('data-parent') : null;
                while (currentParentId && currentParentId !== 'null') {
                    traceIds.add(currentParentId);
                    let pNode = nodesArr.find(n => n.getAttribute('data-id') === currentParentId);
                    currentParentId = pNode ? pNode.getAttribute('data-parent') : null;
                }

                // 2. Traverse DOWN to the leaves
                let currentLevelIds = [startNodeId];
                while(currentLevelIds.length > 0) {
                    let nextLevelIds = [];
                    nodesArr.forEach(n => {
                        const parentId = n.getAttribute('data-parent');
                        if (currentLevelIds.includes(parentId)) {
                            const id = n.getAttribute('data-id');
                            traceIds.add(id);
                            nextLevelIds.push(id);
                        }
                    });
                    currentLevelIds = nextLevelIds;
                }
                return traceIds;
            }

            function highlightTraceLineage(startNodeId) {
                nodes.forEach(n => n.classList.remove('active-trace', 'trace-dimmed'));
                if (!startNodeId) return;

                const traceIds = getLineageSet(startNodeId);

                // Apply states based on explicit dataset linkage
                nodes.forEach(n => {
                    if (traceIds.has(n.getAttribute('data-id'))) {
                        n.classList.add('active-trace');
                    } else {
                        n.classList.add('trace-dimmed');
                    }
                });
            }

            nodes.forEach(node => {
                // Desktop Hover
                node.addEventListener('mouseenter', () => {
                    if (container.dataset.touchLocked === 'true') return;
                    highlightTraceLineage(node.getAttribute('data-id'));
                });

                node.addEventListener('mouseleave', () => {
                    if (container.dataset.touchLocked === 'true') return;
                    highlightTraceLineage(null);
                });

                // Mobile/Universal Click-to-Lock Trace Mechanism
                node.addEventListener('click', (e) => {
                    e.stopPropagation(); 
                    const nodeId = node.getAttribute('data-id');
                    if (container.dataset.lockedNode === nodeId) {
                        // Toggle Off if clicking the already locked node
                        container.dataset.touchLocked = 'false';
                        container.dataset.lockedNode = '';
                        highlightTraceLineage(null);
                    } else {
                        // Lock Trace on this node
                        container.dataset.touchLocked = 'true';
                        container.dataset.lockedNode = nodeId;
                        highlightTraceLineage(nodeId);
                        playClickSound(1200); 
                    }
                });
            });

            // Tap background to unlock
            container.addEventListener('click', () => {
                container.dataset.touchLocked = 'false';
                container.dataset.lockedNode = '';
                highlightTraceLineage(null);
            });
        }

        /* --- RENDER ENGINE --- */
        function renderMatrix() {
            // Replaced block-reflow hacks with explicit Web Animations API calls
            matrixEl.animate([
                { opacity: 0, transform: 'translateY(10px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], { duration: 250, easing: 'ease-out' });

            if (currentPath.length === 0) {
                // DEPTH 0: ROOT / GROVE
                pathDisplayEl.textContent = 'ROOT // TARGET ASSEMBLIES';
                btnRetractEl.style.display = 'none';
                
                let nodesHtml = '';
                projects.forEach(p => {
                    nodesHtml += createNodeHtml(p.id, p.title, `ID: ${String(p.id).padStart(2, '0')}`, 'whole');
                });
                matrixEl.innerHTML = `<div class="node-grid">${nodesHtml}</div>`;

            } else if (currentPath.length === 1) {
                // DEPTH 1: PROJECT CONTEXT
                const project = projects.find(p => p.id == currentPath[0]);
                if (!project) return drillUp();

                pathDisplayEl.textContent = `ROOT // ${project.title}`;
                btnRetractEl.style.display = 'inline-flex';

                let metaHtml = `
                    <div class="context-meta">
                        <h1>${project.title}</h1>
                        <p>${project.description}</p>
                        ${project.url ? `<a href="${project.url}" target="_blank" class="btn-action btn-external">CONSUME SOURCE ↗</a>` : ''}
                    </div>
                `;

                let nodesHtml = '';
                project.segments.forEach(s => {
                    nodesHtml += createNodeHtml(s.id, s.title, `EXTRACT: ${s.id}`, 'sliced');
                });

                matrixEl.innerHTML = `
                    ${metaHtml}
                    <div class="node-grid" style="margin-top: 1rem;">${nodesHtml}</div>
                `;

            } else if (currentPath.length === 2) {
                // DEPTH 2: EXTRACTION VIEWER
                const project = projects.find(p => p.id == currentPath[0]);
                const segment = project?.segments.find(s => s.id == currentPath[1]);
                if (!segment) return drillUp();

                pathDisplayEl.textContent = `ROOT // ${project.title} // EXTRACT ${segment.id}`;
                btnRetractEl.style.display = 'inline-flex';

                let contentHtml = '';
                switch(segment.type) {
                    case 'text': contentHtml = `<p>${segment.content}</p>`; break;
                    case 'image': contentHtml = `<img src="${segment.content}" alt="${segment.title}">`; break;
                    case 'code': contentHtml = `<pre><code>${segment.content}</code></pre>`; break;
                    case 'iframe': contentHtml = `<iframe src="${segment.content}" title="${segment.title}"></iframe>`; break;
                    case 'fractal': contentHtml = buildFractalHTML(segment.tree); break;
                }

                matrixEl.innerHTML = `
                    <div class="extraction-viewer">
                        <h2>${segment.title}</h2>
                        ${contentHtml}
                    </div>
                `;

                // Bind trace events if the payload is a fractal graph
                if (segment.type === 'fractal') {
                    setupFractalInteractions();
                }
            }
        }
    </script>
</body>

</html>
