<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f47a45" />
    <title>Worldtext Antikythera Archive</title>
    <style>
        :root {
            --bg: #f47a45;
            --orange: #ff6a00;
            --seg: #f99f2a;
            --cream: #fff6df;
            --paper: #fff;
            --ink: #000;
            --muted: rgba(0, 0, 0, .58);
            --active: #000;
            --activeText: #fff6df;
            --line: 3px solid var(--ink);
            --thin: 1px solid rgba(0, 0, 0, .34);
            --gap: 7px;
            --font: Inter, "Space Grotesk", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        * {
            box-sizing: border-box;
            border-radius: 0 !important
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font);
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            cursor: crosshair;
        }

        button,
        a {
            font: inherit;
            color: inherit;
            border: 0;
            background: none;
            text-decoration: none;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent
        }

        .app {
            width: 100vw;
            height: 100vh;
            height: 100svh;
            display: grid;
            grid-template-rows: minmax(0, 1fr);
            overflow: hidden;
            background:
                linear-gradient(rgba(0, 0, 0, .035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, .035) 1px, transparent 1px),
                var(--bg);
            background-size: 20px 20px;
        }

        /* STAGE */
        .stage {
            min-height: 0;
            display: grid;
            grid-template-columns: .66fr .62fr .54fr .48fr 2.45fr;
            gap: var(--gap);
            padding: var(--gap);
            overflow: hidden;
        }

        .rail {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr);
            overflow: hidden;
        }

        .track {
            position: relative;
            min-height: 0;
            height: 100%;
            border-left: var(--line);
            border-right: var(--line);
            border-top: var(--line);
            display: grid;
            overflow: hidden;
            background: var(--bg);
            background-image:
                repeating-linear-gradient(to bottom, rgba(0, 0, 0, .5) 0 1px, transparent 1px 15px),
                repeating-linear-gradient(to bottom, rgba(0, 0, 0, .5) 0 1px, transparent 1px 15px);
            background-size: 6px 100%, 6px 100%;
            background-position: left, right;
            background-repeat: no-repeat;
        }

        .track::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: .12;
            background: linear-gradient(90deg, rgba(0, 0, 0, .4), transparent 12%, transparent 88%, rgba(0, 0, 0, .4));
        }

        /* CELLS / DIAL TEETH */
        .cell {
            min-width: 0;
            min-height: 0;
            position: relative;
            z-index: 1;
            border-bottom: var(--thin);
            border-top: 1px solid rgba(255, 255, 255, .36);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            background: var(--bg);
            display: grid;
            overflow: hidden;
            padding: 6px;
            line-height: 1;
            font-weight: 1000;
            transition: all .14s cubic-bezier(.2, .8, .2, 1);
        }

        .cell:hover:not(.active) {
            background: rgba(255, 255, 255, .15)
        }

        .cell.muted {
            opacity: .36
        }

        .cell.near {
            opacity: .82
        }

        .cell.inPath {
            box-shadow: inset 0 0 0 3px rgba(255, 246, 223, .42)
        }

        .cell.echo::before {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 6px;
            height: 4px;
            background: var(--cream);
            border: 1px solid var(--ink);
        }

        .cell.time::after {
            content: "";
            position: absolute;
            right: 7px;
            top: 7px;
            width: 7px;
            height: 7px;
            border: 1px solid var(--ink);
            background: var(--ink);
        }

        .cell.active {
            background: var(--active);
            color: var(--activeText);
            outline: 2px solid var(--cream);
            outline-offset: -2px;
            border-left-color: var(--orange);
            border-right-color: var(--orange);
            z-index: 10;
            transform: scale(1.025);
            box-shadow: 0 14px 28px rgba(0, 0, 0, .42);
        }

        .cell.active.echo::before {
            background: var(--orange)
        }

        .cell.active.time::after {
            background: var(--cream);
            border-color: var(--cream)
        }

        .cellInner {
            min-width: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            align-items: center;
            justify-items: center;
            gap: 4px;
        }

        .dialMark {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 900;
            color: currentColor;
            opacity: .64;
            letter-spacing: .05em;
        }

        .dialIcon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .dialIcon svg {
            width: 100%;
            height: 100%
        }

        .dialDeg {
            font-size: 9px;
            opacity: .78
        }

        .cellLabel {
            display: block;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            height: 100%;
            min-width: 0;
            text-align: center;
            font-size: clamp(10px, 1.05vw, 14px);
            font-weight: 900;
            letter-spacing: .045em;
            text-transform: uppercase;
            opacity: .76;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cellRole,
        .cellSub {
            display: none
        }

        .cellDots {
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
            opacity: .64;
        }

        .dot {
            width: 6px;
            height: 6px;
            border: 1px solid currentColor;
            background: transparent;
            flex: 0 0 auto;
        }

        .dot.filled {
            background: currentColor
        }

        .countBadge {
            min-width: 18px;
            height: 14px;
            padding: 1px 3px;
            border: 1px solid currentColor;
            display: inline-grid;
            place-items: center;
            font-size: 9px;
            line-height: 1;
            font-weight: 1000;
        }

        /* active read-head */
        .cell.active .cellInner {
            grid-template-rows: auto auto minmax(0, 1fr) auto auto;
            justify-items: start;
            padding: 4px;
        }

        .cell.active .dialMark {
            flex-direction: row;
            justify-content: flex-start;
            opacity: 1;
            color: var(--cream);
        }

        .cell.active .dialIcon {
            width: 14px;
            height: 14px;
            color: var(--orange);
        }

        .cell.active .dialDeg {
            color: var(--cream)
        }

        .cell.active .cellLabel {
            writing-mode: horizontal-tb;
            transform: none;
            height: auto;
            white-space: normal;
            text-align: left;
            opacity: 1;
            letter-spacing: -.025em;
            line-height: 1.05;
        }

        .cell.active .cellRole {
            display: block;
            font-size: 9px;
            letter-spacing: .1em;
            color: var(--orange);
            text-transform: uppercase;
            opacity: 1;
        }

        .cell.active .cellSub {
            display: block;
            font-size: 10px;
            font-weight: 700;
            opacity: .82;
            white-space: normal;
        }

        .cell.active .cellDots {
            justify-content: flex-start;
            opacity: 1;
        }

        .dCell.active .cellLabel {
            font-size: clamp(16px, 2.2vw, 30px)
        }

        .cCell.active .cellLabel {
            font-size: clamp(15px, 2vw, 27px)
        }

        .bCell.active .cellLabel {
            font-size: clamp(13px, 1.65vw, 22px)
        }

        .lCell.active .cellLabel {
            font-size: clamp(12px, 1.5vw, 18px)
        }

        /* DETAIL */
        .detail {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: 44px minmax(0, 1fr) 74px auto 40px;
            gap: var(--gap);
            overflow: hidden;
        }

        .selectionBar {
            min-width: 0;
            border: var(--line);
            background: var(--cream);
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 8px;
            padding: 6px 9px;
            overflow: hidden;
        }

        .selectionTitle {
            min-width: 0;
            font-size: clamp(14px, 1.7vw, 23px);
            line-height: .95;
            font-weight: 1000;
            letter-spacing: -.055em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .selectionCount {
            min-width: 42px;
            height: 28px;
            border: var(--line);
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 1000;
            line-height: 1;
            text-transform: uppercase;
            background: var(--paper);
        }

        /* payload content */
        .payloadScroll {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 4px;
        }

        .payloadText {
            flex-shrink: 0;
            border: var(--line);
            background: var(--cream);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: clamp(19px, 2.35vw, 34px);
            line-height: 1.15;
            font-weight: 820;
        }

        .payloadText .line {
            display: grid;
            grid-template-columns: 3.25ch minmax(0, 1fr);
            gap: 12px;
            min-width: 0;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 0, 0, .12);
        }

        .payloadText .line:last-child {
            border-bottom: none;
            padding-bottom: 0
        }

        .lineNo {
            color: var(--muted);
            font-size: .72em;
            font-weight: 1000;
            line-height: 1.4;
        }

        .lineText {
            min-width: 0;
            word-wrap: break-word
        }

        .payloadFrame {
            flex-grow: 1;
            min-height: 44vh;
            border: var(--line);
            background: var(--paper);
            display: grid;
            overflow: hidden;
        }

        .iframeSlot {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: var(--paper)
        }

        .mediaSlot {
            width: 100%;
            min-height: 44vh;
            display: grid;
            place-items: center;
            padding: 18px;
            border: var(--line);
            background: var(--bg);
        }

        .mediaSlot svg {
            width: min(100%, 380px);
            height: min(100%, 260px);
            display: block
        }

        /* ASSOCIATION STRIP */
        .pattern {
            border: var(--line);
            background: var(--cream);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            overflow: hidden;
        }

        .pattern button {
            min-width: 0;
            border-right: var(--thin);
            padding: 9px;
            display: grid;
            align-content: center;
            gap: 4px;
            text-align: left;
        }

        .pattern button:last-child {
            border-right: 0
        }

        .pattern button:hover {
            background: var(--paper)
        }

        .patternLabel {
            font: 1000 8px/1 var(--mono);
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .patternTitle {
            min-width: 0;
            font: 1000 12px/.98 var(--mono);
            text-transform: uppercase;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .patternPath {
            color: rgba(0, 0, 0, .55);
            font: 900 8px/1 var(--mono);
            text-transform: uppercase;
        }

        /* controls */
        .controls {
            display: grid;
            grid-template-columns: .8fr 1fr 1fr .8fr;
            border: var(--line);
            background: var(--cream);
        }

        .control {
            min-height: 48px;
            border-right: var(--line);
            font-size: 13px;
            font-weight: 1000;
            text-transform: uppercase;
            letter-spacing: .06em;
            transition: background .15s;
        }

        .control:hover {
            background: rgba(0, 0, 0, .05)
        }

        .control.modeControl {
            background: var(--active);
            color: var(--activeText);
        }

        #railBtn {
            background: var(--cream);
            color: var(--ink)
        }

        #railBtn:hover {
            background: var(--ink);
            color: var(--cream)
        }

        #viewBtn {
            background: var(--active);
            color: var(--activeText)
        }

        .control:last-child {
            border-right: 0
        }

        .control:active,
        .openTop:active {
            transform: translateY(2px)
        }


        .viewDock {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            border: var(--line);
            background: var(--cream);
            overflow: hidden;
        }

        .dockBtn {
            min-width: 0;
            min-height: 40px;
            border-right: var(--thin);
            display: grid;
            place-items: center;
            padding: 0 6px;
            font-size: 10px;
            font-weight: 1000;
            text-transform: uppercase;
            letter-spacing: .055em;
            white-space: nowrap;
        }

        .dockBtn:last-child {
            border-right: 0
        }

        .dockBtn:hover,
        .dockBtn.active {
            background: var(--ink);
            color: var(--cream);
        }

        .dockLink.is-disabled {
            pointer-events: none;
            opacity: .35;
            background: rgba(255, 246, 223, .5);
            color: rgba(0, 0, 0, .55);
        }

        @media(max-width:760px) {
            .viewDock {
                min-height: 36px;
                border-width: 3px;
            }

            .dockBtn {
                min-height: 36px;
                font-size: 8px;
                letter-spacing: .025em;
                padding: 0 3px;
            }
        }

        /* semantic zoom: grid */
        body[data-view="grid"] .stage {
            grid-template-columns: 1fr;
            display: block;
            overflow-y: auto;
        }

        body[data-view="grid"] .railD,
        body[data-view="grid"] .railC,
        body[data-view="grid"] .railL,
        body[data-view="grid"] .detail {
            display: none
        }

        body[data-view="grid"] .railB {
            display: block
        }

        body[data-view="grid"] .railB .track {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            grid-auto-rows: min-content;
            gap: 3rem;
            padding: 4rem;
            border: none;
            overflow: visible;
            background: transparent;
            background-image: none;
        }

        body[data-view="grid"] .railB .track::before {
            display: none
        }

        body[data-view="grid"] .bCell {
            border: none;
            background: transparent;
            aspect-ratio: 1;
            outline: none;
            box-shadow: none;
            padding: 0;
            transform: none;
        }

        body[data-view="grid"] .bCell .cellInner {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        body[data-view="grid"] .bCell .dialMark {
            display: none
        }

        body[data-view="grid"] .bCell .cellRole,
        body[data-view="grid"] .bCell .cellSub {
            display: none
        }

        body[data-view="grid"] .bCell .cellLabel {
            writing-mode: horizontal-tb;
            transform: none;
            display: block;
            height: auto;
            white-space: normal;
            text-align: center;
            font-size: 14px;
        }

        .orangeWrap {
            display: flex;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .orangeWrap svg {
            width: clamp(100px, 80%, 145px);
            height: auto;
            filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .2));
            transition: transform .2s;
        }

        body[data-view="grid"] .bCell:hover .orangeWrap svg {
            transform: translateY(-5px)
        }

        /* semantic zoom: timeline */
        body[data-view="timeline"] .stage {
            grid-template-columns: 1fr;
            display: block;
            overflow-y: hidden;
        }

        body[data-view="timeline"] .railD,
        body[data-view="timeline"] .railC,
        body[data-view="timeline"] .railB,
        body[data-view="timeline"] .detail {
            display: none
        }

        body[data-view="timeline"] .railL {
            display: block;
            height: 100%;
        }

        body[data-view="timeline"] .railL .track {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 4rem;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4rem;
            border: none;
            background: transparent;
            background-image: none;
        }

        body[data-view="timeline"] .railL .track::before {
            display: none
        }

        body[data-view="timeline"] .lCell {
            flex: 0 0 154px;
            height: 154px;
            border-radius: 50% !important;
            border: var(--line);
            background: var(--cream);
            outline: none;
            box-shadow: none;
            overflow: visible;
            padding: 10px;
            transform: none;
        }

        body[data-view="timeline"] .lCell::after {
            content: "";
            position: absolute;
            right: -4rem;
            top: 50%;
            width: 4rem;
            height: 4px;
            background: var(--ink);
            z-index: -1;
        }

        body[data-view="timeline"] .lCell:last-child::after {
            display: none
        }

        body[data-view="timeline"] .lCell.active {
            background: var(--active);
            color: var(--activeText);
            transform: scale(1.14);
            box-shadow: 0 10px 20px rgba(0, 0, 0, .3);
        }

        body[data-view="timeline"] .lCell .cellInner {
            align-items: center;
            text-align: center;
        }

        body[data-view="timeline"] .lCell .cellLabel {
            display: block;
            writing-mode: horizontal-tb;
            transform: none;
            font-size: 13px;
            -webkit-line-clamp: 3;
            text-align: center;
            white-space: normal;
        }

        body[data-view="timeline"] .lCell .dialMark {
            flex-direction: row;
            margin-bottom: 8px
        }

        body[data-view="timeline"] .lCell .cellDots {
            display: none
        }

        /* mobile */
        @media(max-width:760px) {
            :root {
                --gap: 5px
            }

            .stage {
                grid-template-columns: .55fr .5fr .44fr .62fr;
                grid-template-rows: minmax(260px, 47svh) minmax(0, 1fr);
                gap: var(--gap);
                padding: var(--gap);
            }

            .detail {
                grid-column: 1/-1;
                grid-row: 1;
                grid-template-rows: 34px minmax(0, 1fr) 50px 40px 36px;
                gap: var(--gap);
            }

            .rail {
                grid-row: 2;
                min-height: 0
            }

            .rail:nth-of-type(1) {
                grid-column: 1
            }

            .rail:nth-of-type(2) {
                grid-column: 2
            }

            .rail:nth-of-type(3) {
                grid-column: 3
            }

            .rail:nth-of-type(4) {
                grid-column: 4
            }

            .track {
                background-size: 4px 100%, 4px 100%;
                border-width: 2px;
            }

            .cell {
                padding: 2px;
                border-left-width: 4px;
                border-right-width: 4px;
            }

            .dialMark {
                font-size: 8px;
                flex-direction: column;
                gap: 2px
            }

            .dialIcon {
                width: 12px;
                height: 12px
            }

            .cellLabel {
                font-size: 9px
            }

            .cell.active .cellInner {
                padding: 2px
            }

            .cell.active .dialMark {
                flex-direction: column
            }

            .cell.active .cellLabel {
                font-size: clamp(12px, 3.5vw, 16px)
            }

            .cell.active .cellRole {
                font-size: 7px
            }

            .cell.active .cellSub {
                font-size: 8px
            }

            .dot {
                width: 5px;
                height: 5px
            }

            .countBadge {
                min-width: 14px;
                height: 12px;
                font-size: 7px;
                padding: 0 2px
            }

            .selectionBar {
                padding: 5px 7px
            }

            .selectionTitle {
                font-size: clamp(13px, 4.3vw, 18px)
            }

            .selectionCount {
                min-width: 36px;
                height: 24px;
                font-size: 10px
            }

            .payloadScroll {
                padding-right: 0
            }

            .payloadText {
                padding: 12px;
                font-size: clamp(17px, 5.2vw, 25px);
                gap: 8px;
                line-height: 1.1;
            }

            .payloadText .line {
                grid-template-columns: 3.2ch minmax(0, 1fr);
                gap: 8px
            }

            .payloadText .lineNo {
                font-size: .76em
            }

            .payloadFrame,
            .mediaSlot {
                min-height: 44svh
            }

            .pattern button {
                padding: 7px
            }

            .patternLabel {
                font-size: 7px
            }

            .patternTitle {
                font-size: 9px
            }

            .patternPath {
                font-size: 7px
            }

            .control {
                min-height: 38px;
                font-size: 11px;
                letter-spacing: .045em
            }

            body[data-view="grid"] .railB .track {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                padding: 2rem;
                gap: 2rem;
            }

            body[data-view="timeline"] .railL .track {
                padding: 2rem;
                gap: 2rem;
            }

            body[data-view="timeline"] .lCell {
                flex: 0 0 104px;
                height: 104px;
            }

            body[data-view="timeline"] .lCell::after {
                right: -2rem;
                width: 2rem;
            }
        }

        @media(max-height:690px) {
            .stage {
                grid-template-rows: minmax(220px, 43svh) minmax(0, 1fr)
            }

            .detail {
                grid-template-rows: 32px minmax(0, 1fr) 56px 34px
            }

    <script>
        'use strict';

        const SVG_NS = 'http://www.w3.org/2000/svg';
        const views = ['rails', 'grid', 'timeline'];
        const mobileRails = ['D', 'C', 'B', 'L'];

                // ═══ LIVE DATA FROM wh-grid-data-bridge.js ═══
        // Data fetched from worldtext-program-theory.json + github-ripple-index.json
        var __bridgeData = null;
        var archiveTiers, archiveClusters, archiveBlocks, leafTemplates;
        var blocks, leaves, archiveLeaves;
        var clusters, blocks, leaves;


        const state = { d: 'D1', c: 'C1', b: 'B1', l: '01', view: 'rails' };
        const el = {};
        ['railD', 'railC', 'railB', 'railL', 'selectionTitle', 'selectionCount', 'payload', 'pattern', 'prevBtn', 'railBtn', 'viewBtn', 'nextBtn', 'dockOpen', 'dockRepo'].forEach(id => el[id] = document.getElementById(id));

        function byId(list, id) { return list.find(x => x.id === id) || list[0]; }
        function domain() { return byId(archiveTiers, state.d); }
        function cluster() { return byId(archiveClusters, state.c); }
        function block() { return byId(archiveBlocks, state.b); }
        function leaf() { return byId(archiveLeaves, state.l); }
        function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
        function pulse() { if (navigator.vibrate) navigator.vibrate(8); }

        function clampState() {
            const d = domain();
            if (!d.clusters.includes(state.c)) state.c = d.clusters[0];
            const c = cluster();
            if (!c.blocks.includes(state.b)) state.b = c.blocks[0];
            const b = block();
            if (!b.leaves.includes(state.l)) state.l = b.leaves[0];
        }
        function selectD(id) { pulse(); state.d = id; state.c = domain().clusters[0]; state.b = cluster().blocks[0]; state.l = block().leaves[0]; render(); }
        function selectC(id) { pulse(); state.c = id; state.d = cluster().domain; state.b = cluster().blocks[0]; state.l = block().leaves[0]; render(); }
        function selectB(id) {
            pulse();
            state.b = id;
            state.c = block().cluster;
            state.d = cluster().domain;
            state.l = block().leaves[0];
            if (state.view === 'grid' && window.matchMedia('(max-width:760px)').matches) {
                state.view = 'rails';
                document.body.dataset.mobileRail = 'B';
            }
            render();
        }
        function selectL(id) {
            pulse();
            const l = byId(archiveLeaves, id);
            state.l = l.id;
            state.b = l.block;
            state.c = block().cluster;
            state.d = cluster().domain;
            if (state.view === 'timeline' && window.matchMedia('(max-width:760px)').matches) {
                state.view = 'rails';
                document.body.dataset.mobileRail = 'L';
            }
            render();
        }
        function nextLeaf(delta) {
            pulse();
            const index = archiveLeaves.findIndex(l => l.id === state.l);
            const next = archiveLeaves[(index + delta + archiveLeaves.length) % archiveLeaves.length];
            selectL(next.id);
        }
        function activeMobileRail() {
            return document.body.dataset.mobileRail || 'C';
        }
        function setMobileRail(rail) {
            document.body.dataset.mobileRail = rail;
            updateControlLabels();
            renderRails();
        }
        function cycleMobileRail() {
            const current = activeMobileRail();
            const index = mobileRails.indexOf(current);
            setMobileRail(mobileRails[(index + 1) % mobileRails.length]);
        }
        function updateControlLabels() {
            el.railBtn.textContent = 'rail: ' + activeMobileRail();
            el.viewBtn.textContent = 'view: ' + state.view;
        }
        function setView(view) {
            state.view = view;
            document.body.dataset.view = view;
            updateControlLabels();
            renderRails();
        }
        function cycleView() {
            const index = views.indexOf(state.view);
            setView(views[(index + 1) % views.length]);
        }
        function pathLine() {
            return `${domain().id} ${domain().name} / ${cluster().id} ${cluster().name} / ${block().id} ${block().name} / ${Number(leaf().id)}`;
        }
        function escapeHtml(v) {
            return String(v || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
        }
        function timeNeighbors() {
            const sorted = [...archiveLeaves].sort((a, b) => new Date(a.date) - new Date(b.date));
            const index = sorted.findIndex(l => l.id === state.l);
            return { prev: sorted[index - 1] || null, next: sorted[index + 1] || null };
        }
        function patternEcho() {
            const tags = new Set(leaf().tags || []);

                .filter(l => l.id !== state.l)
                .map(l => ({ ...l, score: (l.tags || []).filter(t => tags.has(t)).length }))

                .sort((a, b) => b.score - a.score || new Date(b.date) - new Date(a.date))[0] || null;

        function openCurrent() {
            const target = currentOpenTarget();

                btn.classList.toggle('active', btn.dataset.directView === state.view);

        /* payload */
        function renderPayload() {
            const l = leaf();
            const rows = [
                pathLine(),
                l.text,
                block().title,
                domain().desc,
                'Associations are encoded as time neighbors and pattern echoes inside the coordinate machine.'

            el.selectionCount.textContent = state.d;

        }

            return `<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;background:#fff6df;color:#000}body{display:grid;place-items:center;padding:18px}.box{width:100%;height:100%;border:3px solid #000;background:#fff;display:grid;place-items:center;text-align:center;padding:18px}h1{margin:0;font-size:clamp(34px,8vw,80px);line-height:.82;letter-spacing:-.08em;text-transform:uppercase}.path{margin-top:12px;font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.05em;color:rgba(0,0,0,.55)}</style></head><body><main class="box"><div><h1>${escapeHtml(l.title)}</h1><div class="path">${escapeHtml(pathLine())}</div></div></main></body></html>`;
        }
        function renderPattern() {

        /* rails */
        function proportionalWeights(length, activeIndex, pathPredicate) {
            return Array.from({ length }, (_, index) => {
                if (index === activeIndex) return 3.2;
                if (typeof pathPredicate === 'function' && pathPredicate(index)) return 1.75;
                if (Math.abs(index - activeIndex) === 1) return 1.32;

    `;
            }

        function renderRails() {
            const activeDIndex = archiveTiers.findIndex(d => d.id === state.d);

            renderRail(el.railC, archiveClusters, proportionalWeights(archiveClusters.length, activeCIndex, i => archiveClusters[i].domain === state.d), (c, index) => {
                const echo = (leaf().tags || []).some(t => (c.tags || []).includes(t));
                return makeCell(c, index, 'cCell', 'C', c.id === state.c, c.domain !== state.d, Math.abs(index - activeCIndex) === 1, c.domain === state.d, echo, false, () => selectC(c.id), { label: c.name, role: c.id, sub: c.tags.join(' / '), dots: c.blocks.length, total: archiveClusters.length });
            });

            const activeBIndex = archiveBlocks.findIndex(b => b.id === state.b);
            renderRail(el.railB, archiveBlocks, proportionalWeights(archiveBlocks.length, activeBIndex, i => archiveBlocks[i].cluster === state.c), (b, index) => {
                const echo = (leaf().tags || []).some(t => (b.tags || []).includes(t));
                return makeCell(b, index, 'bCell', 'B', b.id === state.b, b.cluster !== state.c, Math.abs(index - activeBIndex) === 1, b.cluster === state.c, echo, false, () => selectB(b.id), { label: b.name, role: b.id, sub: b.title, dots: b.leaves.length, total: archiveBlocks.length });
            });

            const sorted = state.view === 'timeline' ? [...archiveLeaves].sort((a, b) => new Date(a.date) - new Date(b.date)) : archiveLeaves;
            const activeLIndex = sorted.findIndex(l => l.id === state.l);
            const echoId = patternEcho()?.id;
            const t = timeNeighbors();
            renderRail(el.railL, sorted, proportionalWeights(sorted.length, activeLIndex, i => sorted[i].block === state.b), (l, index) => {
                const isTime = (t.prev && t.prev.id === l.id) || (t.next && t.next.id === l.id);
                const isEcho = echoId === l.id;
                return makeCell(l, index, 'lCell', 'L', l.id === state.l, l.block !== state.b, Math.abs(index - activeLIndex) <= 1, l.block === state.b, isEcho, isTime, () => selectL(l.id), { label: state.view === 'timeline' ? l.kind + ' ' + l.id : l.kind, role: l.date, sub: l.title, dots: 1, total: sorted.length });
            });
        }

        function render() {
            clampState();
            document.body.dataset.view = state.view;
            updateControlLabels();
            renderPayload();
            renderPattern();
            renderRails();
            updateLinks();
        }

        /* svg */
        function svgEl(tag, attrs) {
            const node = document.createElementNS(SVG_NS, tag);
            Object.keys(attrs || {}).forEach(k => node.setAttribute(k, attrs[k]));
            return node;
        }
        function orangeSvgMarkup(activeIndex) {
            let paths = '';
            for (let i = 0; i < 6; i++) {
                const a0 = (i * 60 - 90) * Math.PI / 180;
                const a1 = ((i + 1) * 60 - 90) * Math.PI / 180;
                const r = 39;
                const x0 = 50 + r * Math.cos(a0), y0 = 50 + r * Math.sin(a0);
                const x1 = 50 + r * Math.cos(a1), y1 = 50 + r * Math.sin(a1);
                paths += `<path d="M50 50 L${x0.toFixed(1)} ${y0.toFixed(1)} A39 39 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${activeIndex % 6 === i ? 'var(--seg)' : 'var(--cream)'}" stroke="black" stroke-width="1"/>`;
            }
            return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="var(--orange)" stroke="black" stroke-width="3"/>${paths}<circle cx="50" cy="50" r="10" fill="var(--bg)" stroke="black" stroke-width="2"/></svg>`;
        }

        el.prevBtn.onclick = () => nextLeaf(-1);
        el.nextBtn.onclick = () => nextLeaf(1);
        el.railBtn.onclick = cycleMobileRail;
        el.viewBtn.onclick = cycleView;
        document.querySelectorAll('[data-direct-view]').forEach(btn => {
            btn.onclick = () => setView(btn.dataset.directView);
        });
        document.querySelectorAll('.dockLink').forEach(link => {
            link.addEventListener('click', e => {
                if (link.classList.contains('is-disabled')) e.preventDefault();
            });
        });
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') nextLeaf(-1);
            if (e.key === 'ArrowRight') nextLeaf(1);
            if (e.key.toLowerCase() === 'z') cycleView();
            if (e.key.toLowerCase() === 'v') cycleView();
            if (e.key.toLowerCase() === 'r') cycleMobileRail();
            if (e.key.toLowerCase() === 'o') openCurrent();
        });
        whBridge.boot(function(data) {
            __bridgeData = data;
            archiveTiers = data.archiveTiers;
            archiveClusters = data.archiveClusters;
            archiveBlocks = data.archiveBlocks;
            leafTemplates = data.leafTemplates;
            if (typeof domains !== 'undefined' || true) { try { domains = archiveTiers; } catch(e){} }
            if (typeof clusters !== 'undefined' || true) { try { clusters = archiveClusters; } catch(e){} }
            if (typeof blocks !== 'undefined' || true) { try { blocks = archiveBlocks; } catch(e){} }
            if (typeof works !== 'undefined' || true) {
                try { works = archiveBlocks.map(function(b){ return b.name; }); } catch(e){}
            }
            if (typeof repos !== 'undefined' || true) { try { repos = data.repos || []; } catch(e){} }
            if (typeof leaves !== 'undefined' || true) {
                try {
                    leaves = leafTemplates.map(function(pair, i) {
                        var id = String(i + 1).padStart(2, '0');
                        var owner = archiveBlocks.find(function(bl) { return bl.leaves && bl.leaves.includes(id); });
                        return { id: id, block: owner ? owner.id : 'B1', b: owner ? owner.id : 'B1', title: pair[0] + ' · ' + (owner ? owner.title : 'Worldtext'), art: ['grid','synth','poster','curve','type','color'][i % 6], url: owner && owner.url ? owner.url : '#', date: '2026-01-' + id, lines: [pair[1], owner ? owner.title : 'Worldtext Practice Archive', owner && owner.url ? owner.url : 'payload://local', 'Mode button cycles text, media, iframe, empty.'] };
                    });
                } catch(e){}
            }
            if (typeof archiveLeaves !== 'undefined' || true) { try { archiveLeaves = leaves; } catch(e){} }
            render();
        });
    </script>
</body>
