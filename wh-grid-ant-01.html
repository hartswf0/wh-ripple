<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Orange Coordinate Wireframe Index</title>
    <style>
        :root {
            --bg: #f47a45;
            --orange: #ff6a00;
            --seg: #f99f2a;
            --cream: #fff6df;
            --paper: #fff;
            --ink: #000;
            --muted: rgba(0, 0, 0, .56);
            --active: #000;
            --activeText: #fff6df;
            --line: 3px solid var(--ink);
            --thin: 1px solid rgba(0, 0, 0, .34);
            --gap: 7px;
            --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font);
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
        }

        button,
        a {
            font: inherit;
            color: inherit;
            border: 0;
            background: none;
            text-decoration: none;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
            border-left: var(--line);
            border-top: var(--line)
        }

        ::-webkit-scrollbar-thumb {
            background: var(--orange);
            border: var(--line)
        }

        .app {
            width: 100vw;
            height: 100vh;
            height: 100svh;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            overflow: hidden;
        }

        /* TOP: coordinate + one title + open */
        .topbar {
            min-height: 58px;
            padding: 6px 8px;
            display: grid;
            grid-template-columns: 92px minmax(0, 1fr) 54px;
            gap: 8px;
            align-items: center;
            border-bottom: var(--line);
            background: var(--bg);
        }

        .topDial {
            width: 92px;
            height: 46px;
            border: var(--line);
            background: var(--cream);
            display: grid;
            grid-template-columns: 38px minmax(0, 1fr);
            align-items: center;
            gap: 4px;
            padding: 3px;
            overflow: hidden;
        }

        .topDial svg {
            width: 34px;
            height: 34px;
            display: block;
            animation: spinDisc 12s linear infinite;
            transform-origin: 50% 50%;
        }

        @keyframes spinDisc {
            to {
                transform: rotate(360deg)
            }
        }

        .coordReadout {
            min-width: 0;
            font: 1000 7px/1 var(--mono);
            letter-spacing: .015em;
            text-transform: uppercase;
            overflow: hidden;
        }

        .coordReadout b {
            display: block;
            font-size: 9px;
            line-height: .95;
            letter-spacing: -.03em;
        }

        .coordReadout span {
            display: block;
            color: var(--muted);
            margin-top: 2px;
        }

        .titleWrap {
            min-width: 0;
            display: grid;
            align-content: center;
            gap: 2px;
        }

        .coordLine {
            min-width: 0;
            font: 1000 9px/1 var(--mono);
            letter-spacing: .055em;
            text-transform: uppercase;
            color: rgba(0, 0, 0, .62);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .onlyTitle {
            min-width: 0;
            font-size: clamp(17px, 2.15vw, 28px);
            line-height: 1;
            font-weight: 1000;
            letter-spacing: -.04em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .openTop {
            width: 54px;
            height: 46px;
            border: var(--line);
            background: var(--cream);
            display: grid;
            place-items: center;
            font-size: 24px;
            line-height: 1;
            font-weight: 1000;
        }

        .openTop:hover {
            background: var(--orange)
        }

        /* STAGE */
        .stage {
            min-height: 0;
            display: grid;
            grid-template-columns: .58fr .54fr .5fr .48fr 2.65fr;
            gap: var(--gap);
            padding: var(--gap);
            overflow: hidden;
        }

        .rail {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr);
            overflow: hidden;
        }

        .track {
            position: relative;
            min-height: 0;
            height: 100%;
            border-left: var(--line);
            border-right: var(--line);
            border-top: var(--line);
            display: grid;
            overflow: hidden;
            background: var(--bg);
            background-image:
                repeating-linear-gradient(to bottom, rgba(0, 0, 0, .44) 0px, rgba(0, 0, 0, .44) 1px, transparent 1px, transparent 15px),
                repeating-linear-gradient(to bottom, rgba(0, 0, 0, .44) 0px, rgba(0, 0, 0, .44) 1px, transparent 1px, transparent 15px);
            background-size: 6px 100%, 6px 100%;
            background-position: left, right;
            background-repeat: no-repeat;
        }

        /* RAIL CELLS: angle + short label only */
        .cell {
            min-width: 0;
            min-height: 0;
            position: relative;
            z-index: 1;
            border-bottom: var(--thin);
            border-top: 1px solid rgba(255, 255, 255, .35);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            background: var(--bg);
            display: grid;
            overflow: hidden;
            padding: 6px;
            line-height: 1;
            font-weight: 1000;
            transition: all .14s cubic-bezier(.2, .8, .2, 1);
        }

        .cellInner {
            min-width: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            align-items: center;
            justify-items: center;
            gap: 4px;
        }

        .angleMark {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font: 900 9px/1 var(--mono);
            opacity: .62;
            letter-spacing: .02em;
        }

        .angleMark svg {
            width: 17px;
            height: 17px;
        }

        .cellLabel {
            display: block;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: clamp(10px, 1.12vw, 14px);
            font-weight: 1000;
            letter-spacing: .035em;
            text-transform: uppercase;
            opacity: .74;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            height: 100%;
        }

        .cellSub {
            display: none
        }

        .cellDots {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
            opacity: .55;
        }

        .dot {
            width: 6px;
            height: 6px;
            border: 1px solid currentColor;
            background: transparent;
            flex: 0 0 auto;
        }

        .dot.filled {
            background: currentColor
        }

        .countBadge {
            min-width: 18px;
            height: 14px;
            padding: 1px 3px;
            border: 1px solid currentColor;
            display: inline-grid;
            place-items: center;
            font-size: 9px;
            line-height: 1;
            font-weight: 1000;
        }

        .cell:hover:not(.active) {
            background: rgba(255, 255, 255, .15)
        }

        .cell.muted {
            opacity: .32
        }

        .cell.near {
            opacity: .78
        }

        .cell.inPath {
            box-shadow: inset 0 0 0 3px rgba(255, 246, 223, .38)
        }

        .cell.groupStart {
            border-top: var(--line)
        }

        .cell.pairStart {
            border-top: var(--thin)
        }

        .cell.active {
            background: var(--active);
            color: var(--activeText);
            outline: 2px solid var(--cream);
            outline-offset: -2px;
            border-left-color: var(--orange);
            border-right-color: var(--orange);
            transform: scale(1.025);
            box-shadow: 0 15px 30px rgba(0, 0, 0, .38);
            z-index: 10;
            opacity: 1;
        }

        .cell.active .cellInner {
            grid-template-rows: auto minmax(0, 1fr) auto auto;
            justify-items: start;
            padding: 4px;
        }

        .cell.active .angleMark {
            flex-direction: row;
            opacity: 1;
            color: var(--cream);
        }

        .cell.active .angleMark svg {
            width: 15px;
            height: 15px;
            color: var(--orange);
        }

        .cell.active .cellLabel {
            writing-mode: horizontal-tb;
            transform: none;
            height: auto;
            white-space: normal;
            font-size: clamp(16px, 2vw, 25px);
            letter-spacing: -.025em;
            line-height: 1.02;
            opacity: 1;
            text-align: left;
        }

        .cell.active .cellSub {
            display: block;
            font: 800 10px/1.15 var(--mono);
            opacity: .78;
            text-transform: uppercase;
        }

        .cell.active .cellDots {
            justify-content: flex-start;
            opacity: 1;
            margin-top: 4px;
        }

        /* DETAIL: brief blurb + big iframe */
        .detail {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
            gap: var(--gap);
            overflow: hidden;
        }

        .payloadShell {
            min-width: 0;
            min-height: 0;
            display: grid;
            overflow: hidden;
        }

        .payload {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: var(--gap);
            overflow: hidden;
        }

        .blurb {
            border: var(--line);
            background: var(--cream);
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: start;
            gap: 12px;
            padding: 12px 14px;
        }

        .blurbText {
            min-width: 0;
            font-size: clamp(18px, 2.2vw, 34px);
            line-height: 1.08;
            font-weight: 850;
            overflow-wrap: anywhere;
        }

        .blurbMeta {
            border: var(--line);
            background: var(--paper);
            padding: 6px 8px;
            font: 1000 10px/1 var(--mono);
            text-transform: uppercase;
            letter-spacing: .05em;
            white-space: nowrap;
        }

        .frameBlock {
            min-width: 0;
            min-height: 0;
            border: var(--line);
            background: var(--paper);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            overflow: hidden;
        }

        .frameBar {
            border-bottom: var(--thin);
            background: var(--cream);
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            font: 1000 9px/1 var(--mono);
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
            min-width: 0;
        }

        .frameBar span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .iframeSlot {
            width: 100%;
            height: 100%;
            border: 0;
            background: var(--paper);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            border: var(--line);
            background: var(--cream);
        }

        .control {
            min-height: 48px;
            border-right: var(--line);
            font-size: 13px;
            font-weight: 1000;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .control:hover {
            background: rgba(0, 0, 0, .06)
        }

        .control.modeControl {
            background: var(--active);
            color: var(--activeText);
        }

        .control:last-child {
            border-right: 0
        }

        .control:active,
        .openTop:active {
            transform: translateY(2px)
        }

        /* semantic zoom: grid */
        body[data-view="grid"] .stage {
            display: block;
            overflow: auto;
        }

        body[data-view="grid"] .rail:not(.projectRail),
        body[data-view="grid"] .detail {
            display: none
        }

        body[data-view="grid"] .projectRail {
            display: block
        }

        body[data-view="grid"] .projectRail .track {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            grid-auto-rows: min-content;
            gap: 2.4rem;
            padding: 3.4rem;
            background: transparent;
            border: none;
            overflow: visible;
            background-image: none;
        }

        body[data-view="grid"] .bCell {
            border: none;
            background: transparent;
            aspect-ratio: 1;
            outline: none;
            box-shadow: none;
            padding: 0;
            transform: none;
        }

        .orangeWrap {
            display: none
        }

        body[data-view="grid"] .orangeWrap {
            display: flex;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .8rem;
        }

        body[data-view="grid"] .orangeWrap svg {
            width: clamp(100px, 80%, 150px);
            height: auto;
            filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .2));
        }

        body[data-view="grid"] .orangeLabel {
            font: 1000 13px/1 var(--mono);
            text-transform: uppercase;
            text-align: center;
        }

        body[data-view="grid"] .bCell .cellInner {
            display: none
        }

        /* semantic zoom: timeline */
        body[data-view="timeline"] .stage {
            display: block;
            overflow: hidden;
        }

        body[data-view="timeline"] .rail:not(.leafRail),
        body[data-view="timeline"] .detail {
            display: none
        }

        body[data-view="timeline"] .leafRail {
            display: block;
            height: 100%;
        }

        body[data-view="timeline"] .leafRail .track {
            display: flex;
            flex-direction: row;
            overflow: auto hidden;
            align-items: center;
            gap: 3rem;
            padding: 3.5rem;
            background: transparent;
            border: none;
            background-image: none;
        }

        body[data-view="timeline"] .leafCell {
            flex: 0 0 150px;
            height: 150px;
            border-radius: 50%;
            border: var(--line);
            background: var(--cream);
            outline: none;
            box-shadow: none;
            overflow: visible;
            padding: 10px;
            transform: none;
        }

        body[data-view="timeline"] .leafCell::after {
            content: "";
            position: absolute;
            right: -3rem;
            top: 50%;
            width: 3rem;
            height: 4px;
            background: var(--ink);
            z-index: -1;
        }

        body[data-view="timeline"] .leafCell:last-child::after {
            display: none
        }

        body[data-view="timeline"] .leafCell.active {
            background: var(--active);
            color: var(--activeText);
            transform: scale(1.12);
            box-shadow: 0 10px 20px rgba(0, 0, 0, .3);
        }

        body[data-view="timeline"] .leafCell .cellInner {
            align-items: center;
            justify-items: center;
            text-align: center;
        }

        body[data-view="timeline"] .leafCell .cellLabel {
            display: block;
            writing-mode: horizontal-tb;
            transform: none;
            height: auto;
            font-size: 14px;
            text-align: center;
        }

        body[data-view="timeline"] .leafCell .angleMark {
            flex-direction: row;
            margin-bottom: 8px
        }

        body[data-view="timeline"] .leafCell .cellDots {
            display: none
        }


        /* persistent view switcher: never get stuck in grid/timeline */
        .viewDock {
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 10px;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(4, auto);
            gap: 5px;
            padding: 5px;
            border: var(--line);
            background: var(--cream);
            box-shadow: 0 8px 0 rgba(0, 0, 0, .18);
        }

        .viewDock button {
            min-width: 68px;
            min-height: 34px;
            padding: 6px 9px;
            border: var(--thin);
            background: var(--paper);
            font: 1000 10px/1 var(--mono);
            letter-spacing: .055em;
            text-transform: uppercase;
        }

        .viewDock button.active {
            background: var(--ink);
            color: var(--cream);
        }

        body[data-view="rails"] .viewDock {
            opacity: .92;
        }

        body[data-view="grid"] .viewDock,
        body[data-view="timeline"] .viewDock {
            opacity: 1;
        }

        @media(max-width:760px) {
            .viewDock {
                left: 5px;
                right: 5px;
                bottom: 5px;
                transform: none;
                grid-template-columns: repeat(4, 1fr);
            }

            .viewDock button {
                min-width: 0;
                min-height: 32px;
                font-size: 9px;
                padding: 5px 4px;
            }

            body[data-view="grid"] .stage,
            body[data-view="timeline"] .stage {
                padding-bottom: 50px;
            }
        }

        /* MOBILE */
        @media(max-width:760px) {
            :root {
                --gap: 5px
            }

            .topbar {
                min-height: 58px;
                padding: 6px;
                grid-template-columns: 76px minmax(0, 1fr) 42px;
                gap: 6px;
            }

            .topDial {
                width: 76px;
                height: 38px;
                grid-template-columns: 28px minmax(0, 1fr);
                padding: 3px
            }

            .topDial svg {
                width: 26px;
                height: 26px
            }

            .coordReadout {
                font-size: 6px
            }

            .coordReadout b {
                font-size: 8px
            }

            .coordLine {
                font-size: 7px
            }

            .onlyTitle {
                font-size: clamp(15px, 4.5vw, 21px);
                line-height: 1.05
            }

            .openTop {
                width: 42px;
                height: 38px;
                font-size: 21px
            }

            .stage {
                grid-template-columns: .55fr .5fr .44fr .62fr;
                grid-template-rows: minmax(245px, 44svh) minmax(0, 1fr);
            }

            .detail {
                grid-column: 1 / -1;
                grid-row: 1;
                grid-template-rows: minmax(0, 1fr) 38px;
            }

            .rail {
                grid-row: 2
            }

            .domainRail {
                grid-column: 1
            }

            .clusterRail {
                grid-column: 2
            }

            .projectRail {
                grid-column: 3
            }

            .leafRail {
                grid-column: 4
            }

            .track {
                background-size: 4px 100%, 4px 100%;
                border-width: 2px
            }

            .cell {
                padding: 2px;
                border-left-width: 4px;
                border-right-width: 4px
            }

            .angleMark {
                font-size: 7px;
                gap: 2px
            }

            .angleMark svg {
                width: 12px;
                height: 12px
            }

            .cellLabel {
                font-size: 9px
            }

            .cell.active .cellInner {
                padding: 2px
            }

            .cell.active .angleMark {
                flex-direction: column
            }

            .cell.active .cellLabel {
                font-size: clamp(12px, 3.5vw, 16px)
            }

            .dot {
                width: 5px;
                height: 5px
            }

            .countBadge {
                min-width: 14px;
                height: 12px;
                font-size: 7px;
                padding: 0 2px
            }

            .blurb {
                grid-template-columns: 1fr;
                padding: 9px 10px;
                gap: 7px;
            }

            .blurbText {
                font-size: clamp(15px, 4.7vw, 22px);
            }

            .blurbMeta {
                justify-self: start;
                font-size: 8px;
                border-width: 2px;
            }

            .frameBlock {
                min-height: 0
            }

            .frameBar {
                padding: 6px 8px;
                font-size: 7px
            }

            .control {
                min-height: 38px;
                font-size: 11px
            }

            body[data-view="grid"] .projectRail .track {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                padding: 2rem;
                gap: 2rem;
            }

            body[data-view="timeline"] .leafRail .track {
                padding: 2rem;
                gap: 2rem;
            }

            body[data-view="timeline"] .leafCell {
                flex-basis: 100px;
                height: 100px;
            }

            body[data-view="timeline"] .leafCell::after {
                right: -2rem;
                width: 2rem;
            }
        }
    </style>
</head>

<body data-view="rails">
    <script src="wh-grid-data-bridge.js"></script>
    <main class="app" aria-label="Orange Coordinate Wireframe Index">
        <header class="topbar">
            <div class="topDial" id="topDial" aria-label="coordinate dial"></div>
            <button class="titleWrap" id="topTitleWrap" type="button" title="Cycle view: rails / grid / timeline">
                <div class="coordLine" id="coordLine">D000 · C000 · B000 · N000</div>
                <div class="onlyTitle" id="topTitle">From Imagetext to Worldtext</div>
            </button>
            <button class="openTop" id="openBtn" type="button" aria-label="Open payload in new window">↗</button>
        </header>

        <section class="stage">
            <section class="rail domainRail" aria-label="Domain rail" id="containerD">
                <div class="track" id="railD"></div>
            </section>
            <section class="rail clusterRail" aria-label="Cluster rail" id="containerC">
                <div class="track" id="railC"></div>
            </section>
            <section class="rail projectRail" aria-label="Work rail" id="containerB">
                <div class="track" id="railB"></div>
            </section>
            <section class="rail leafRail" aria-label="Node rail" id="containerL">
                <div class="track" id="railL"></div>
            </section>

            <section class="detail" aria-label="Selected payload">
                <article class="payloadShell" id="payloadShell"></article>
                <div class="controls">
                    <button class="control" id="prevBtn" type="button">prev</button>
                    <button class="control modeControl" id="zoomBtn" type="button">zoom: rails</button>
                    <button class="control" id="nextBtn" type="button">next</button>
                </div>
            </section>
        </section>

        <nav class="viewDock" aria-label="View switcher">
            <button type="button" id="viewRails">Rails</button>
            <button type="button" id="viewGrid">Grid</button>
            <button type="button" id="viewTimeline">Timeline</button>
            <button type="button" id="viewOpen">Open</button>
        </nav>

    </main>

    <script>
        'use strict';

        const SVG_NS = 'http://www.w3.org/2000/svg';
        const views = ['rails', 'grid', 'timeline'];

                // ═══ LIVE DATA FROM wh-grid-data-bridge.js ═══
        // Data fetched from worldtext-program-theory.json + github-ripple-index.json
        var __bridgeData = null;
        var archiveTiers, archiveClusters, archiveBlocks, leafTemplates;
        var blocks, leaves;
        var domains, clusters, blocks, leaves, works;


        const state = { view: 'rails', d: 'D1', c: 'C1', b: 'B1', l: '01' };
        const el = {};
        ['railD', 'railC', 'railB', 'railL', 'containerD', 'containerC', 'containerB', 'containerL', 'topDial', 'coordLine', 'topTitle', 'topTitleWrap', 'openBtn', 'payloadShell', 'prevBtn', 'zoomBtn', 'nextBtn', 'viewRails', 'viewGrid', 'viewTimeline', 'viewOpen'].forEach(function (id) {
            el[id] = document.getElementById(id);
        });

        function byId(list, id) { return list.find(function (x) { return x.id === id; }) || list[0]; }
        function domain() { return byId(domains, state.d); }
        function cluster() { return byId(clusters, state.c); }
        function block() { return byId(blocks, state.b); }
        function leaf() { return byId(leaves, state.l); }
        function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
        function svgEl(tag, attrs) {
            const node = document.createElementNS(SVG_NS, tag);
            Object.keys(attrs || {}).forEach(function (key) { node.setAttribute(key, attrs[key]); });
            return node;
        }
        function pulse() {
            if (window.navigator && typeof window.navigator.vibrate === 'function') window.navigator.vibrate(8);
        }
        function clampState() {
            const d = domain();
            if (!d.clusters.includes(state.c)) state.c = d.clusters[0];
            const c = cluster();
            if (!c.blocks.includes(state.b)) state.b = c.blocks[0];
            const b = block();
            if (!b.leaves.includes(state.l)) state.l = b.leaves[0];
        }
        function selectD(id) {
            pulse(); state.d = id; state.c = domain().clusters[0]; state.b = cluster().blocks[0]; state.l = block().leaves[0]; console.info('Canonical page registry:', blocks.reduce(function (acc, b) {
                const url = canonicalUrlForBlock(b);
                if (url) acc[url] = (acc[url] || 0) + 1;
                return acc;
            }, {}));
            render();
        }
        function selectC(id) { pulse(); state.c = id; state.d = cluster().domain; state.b = cluster().blocks[0]; state.l = block().leaves[0]; render(); }
        function selectB(id) { pulse(); state.b = id; state.c = block().cluster; state.d = cluster().domain; state.l = block().leaves[0]; if (state.view === 'grid') state.view = 'rails'; render(); }
        function selectL(id) { pulse(); state.l = id; state.b = leaf().block; state.c = block().cluster; state.d = cluster().domain; if (state.view === 'timeline') state.view = 'rails'; render(); }
        function nextLeaf(delta) {
            pulse();
            const index = leaves.findIndex(function (x) { return x.id === state.l; });
            const next = leaves[(index + delta + leaves.length) % leaves.length];
            selectL(next.id);
        }

        /* unique, increasingly specific address angles */
        function indexOfLocal(list, id) { return list.findIndex(function (x) { return x.id === id; }); }
        function angleD(dId) {
            return indexOfLocal(domains, dId) * 120;
        }
        function angleC(cId) {
            const i = indexOfLocal(clusters, cId);
            return (i * 40) % 360;
        }
        function angleB(bId) {
            const i = indexOfLocal(blocks, bId);
            return (i * 20 + 10) % 360;
        }
        function angleN(lId) {
            const i = indexOfLocal(leaves, lId);
            return (i * 10 + 14) % 360;
        }
        function uniqueActiveAngles() {
            const raw = [angleD(state.d), angleC(state.c), angleB(state.b), angleN(state.l)];
            const out = [];
            raw.forEach(function (value) {
                let v = value;
                while (out.includes(v)) v = (v + 3) % 360;
                out.push(v);
            });
            return out;
        }
        function pad3(n) { return String(n).padStart(3, '0'); }
        function address() {
            const a = uniqueActiveAngles();
            return {
                d: a[0], c: a[1], b: a[2], n: a[3],
                compact: 'D' + pad3(a[0]) + ' · C' + pad3(a[1]) + ' · B' + pad3(a[2]) + ' · N' + pad3(a[3]),
                short: 'D' + pad3(a[0]) + '.C' + pad3(a[1]) + '.B' + pad3(a[2]) + '.N' + pad3(a[3])
            };
        }
        function cellAngle(kind, id) {
            if (kind === 'D') return angleD(id);
            if (kind === 'C') return angleC(id);
            if (kind === 'B') return angleB(id);
            return angleN(id);
        }
        function pathBrief() {
            return domain().name + ' / ' + cluster().name + ' / ' + block().name;
        }

        function setView(view) {
            if (!views.includes(view)) view = 'rails';
            pulse();
            state.view = view;
            document.body.setAttribute('data-view', state.view);
            el.zoomBtn.textContent = 'zoom: ' + state.view;
            updateViewDock();
            setTimeout(function () {
                const target = state.view === 'grid' ? el.railB.querySelector('.active') : state.view === 'timeline' ? el.railL.querySelector('.active') : null;
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
            }, 80);
        }
        function cycleZoom() {
            const idx = views.indexOf(state.view);
            setView(views[(idx + 1) % views.length]);
        }

        function makeCell(model, cls, active, muted, marker, handler, near, inPath, index, total, angle) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'cell ' + cls + (active ? ' active' : '') + (muted ? ' muted' : '') + (near ? ' near' : '') + (inPath ? ' inPath' : '') + (marker ? ' ' + marker : '');
            button.setAttribute('aria-label', pad3(angle) + ' degrees: ' + model.label);

            const inner = document.createElement('span');
            inner.className = 'cellInner';

            const angleMark = document.createElement('span');
            angleMark.className = 'angleMark';
            angleMark.appendChild(createOrangeSvg(index, total));
            const deg = document.createElement('span');
            deg.textContent = pad3(angle) + '°';
            angleMark.appendChild(deg);

            const label = document.createElement('span');
            label.className = 'cellLabel';
            label.textContent = model.label;

            const sub = document.createElement('span');
            sub.className = 'cellSub';
            sub.textContent = model.sub || '';

            const dots = document.createElement('span');
            dots.className = 'cellDots';
            addDots(dots, model.count || 1, active || inPath);

            inner.appendChild(angleMark);
            inner.appendChild(label);
            if (model.sub) inner.appendChild(sub);
            inner.appendChild(dots);
            button.appendChild(inner);

            if (cls === 'bCell') {
                const orangeWrap = document.createElement('div');
                orangeWrap.className = 'orangeWrap';
                orangeWrap.appendChild(createOrangeSvg(index, total));
                const orangeLabel = document.createElement('div');
                orangeLabel.className = 'orangeLabel';
                orangeLabel.textContent = pad3(angle) + '° · ' + model.label;
                orangeWrap.appendChild(orangeLabel);
                button.appendChild(orangeWrap);
            }
            button.addEventListener('click', handler);
            return button;
        }
        function addDots(target, count, filled) {
            const visible = Math.min(count, 6);
            for (let i = 0; i < visible; i++) {
                const dot = document.createElement('span');
                dot.className = 'dot' + (filled ? ' filled' : '');
                target.appendChild(dot);
            }
            if (count > 6) {
                const badge = document.createElement('span');
                badge.className = 'countBadge';
                badge.textContent = String(count);
                target.appendChild(badge);
            }
        }
        function proportionalWeights(length, activeIndex, pathPredicate) {
            return Array.from({ length }, function (_, index) {
                if (index === activeIndex) return 5.5;
                if (typeof pathPredicate === 'function' && pathPredicate(index)) return 1.45;
                if (Math.abs(index - activeIndex) === 1) return 1.18;
                return 1;
            });
        }
        function applyGridRows(target, weights) {
            target.style.gridTemplateRows = weights.map(function (w) { return 'minmax(0,' + w + 'fr)'; }).join(' ');
        }
        function renderRail(target, items, weights, make) {
            clear(target);
            applyGridRows(target, weights);
            items.forEach(function (item, index) { target.appendChild(make(item, index, items.length)); });
        }
        function renderRails() {
            const activeDIndex = domains.findIndex(function (d) { return d.id === state.d; });
            renderRail(el.railD, domains, proportionalWeights(domains.length, activeDIndex), function (d, index, total) {
                return makeCell({ label: d.name, sub: d.clusters.length + ' bands', count: d.clusters.length }, 'dCell', d.id === state.d, false, '', function () { selectD(d.id); }, Math.abs(index - activeDIndex) === 1, d.id === state.d, index, total, cellAngle('D', d.id));
            });

            const activeCIndex = clusters.findIndex(function (c) { return c.id === state.c; });
            renderRail(el.railC, clusters, proportionalWeights(clusters.length, activeCIndex, function (index) { return clusters[index].domain === state.d; }), function (c, index, total) {
                return makeCell({ label: c.name, sub: c.blocks.length + ' works', count: c.blocks.length }, 'cCell', c.id === state.c, c.domain !== state.d, index % 3 === 0 ? 'groupStart' : '', function () { selectC(c.id); }, Math.abs(index - activeCIndex) === 1, c.domain === state.d, index, total, cellAngle('C', c.id));
            });

            const activeBIndex = blocks.findIndex(function (b) { return b.id === state.b; });
            renderRail(el.railB, blocks, proportionalWeights(blocks.length, activeBIndex, function (index) { return blocks[index].cluster === state.c; }), function (b, index, total) {
                return makeCell({ label: b.name, sub: b.title, count: b.leaves.length }, 'bCell', b.id === state.b, b.cluster !== state.c, index % 2 === 0 ? 'groupStart' : '', function () { selectB(b.id); }, Math.abs(index - activeBIndex) === 1, b.cluster === state.c, index, total, cellAngle('B', b.id));
            });

            const activeLIndex = leaves.findIndex(function (l) { return l.id === state.l; });
            renderRail(el.railL, leaves, proportionalWeights(leaves.length, activeLIndex, function (index) { return leaves[index].block === state.b; }), function (l, index, total) {
                return makeCell({ label: 'N' + String(Number(l.id)).padStart(2, '0'), sub: l.title, count: 1 }, 'leafCell', l.id === state.l, l.block !== state.b, index % 2 === 0 ? 'pairStart' : '', function () { selectL(l.id); }, Math.abs(index - activeLIndex) <= 1, l.block === state.b, index, total, cellAngle('N', l.id));
            });
        }
        function renderDetail() {
            const a = address();
            const b = block();
            const l = leaf();

            el.coordLine.textContent = a.compact + ' · ' + pathBrief();
            el.topTitle.textContent = b.title;

            clear(el.topDial);
            el.topDial.appendChild(createOrangeSvg(leaves.findIndex(function (x) { return x.id === state.l; }), leaves.length));
            const readout = document.createElement('span');
            readout.className = 'coordReadout';
            readout.innerHTML = '<b>' + a.short + '</b><span>' + pad3(a.n) + '° active</span>';
            el.topDial.appendChild(readout);

            renderPayload();
        }

        function canonicalUrlForBlock(b) {
            if (!b || !b.url || b.url === '#') return '';
            return b.url;
        }
        function canonicalLabel(b) {
            const url = canonicalUrlForBlock(b);
            if (!url) return 'local wireframe';
            try {
                const u = new URL(url, window.location.href);
                if (u.hostname.includes('github.com')) return 'github';
                if (u.hostname.includes('hartswf0.github.io')) return 'public page';
                if (url.startsWith('mailto:')) return 'email';
                return 'external page';
            } catch (e) {
                return 'local page';
            }
        }
        function duplicateUrlCount(url) {
            if (!url || url === '#') return 0;
            return blocks.filter(function (item) { return item.url === url; }).length;
        }

        function renderPayload() {
            const a = address();
            const b = block();
            const l = leaf();

            clear(el.payloadShell);
            const payload = document.createElement('div');
            payload.className = 'payload';

            const blurb = document.createElement('div');
            blurb.className = 'blurb';
            const text = document.createElement('div');
            text.className = 'blurbText';
            text.textContent = l.blurb;
            const meta = document.createElement('div');
            meta.className = 'blurbMeta';
            const dupes = duplicateUrlCount(b.url);
            meta.textContent = a.short + (dupes > 1 ? ' · shared page' : '');
            blurb.appendChild(text);
            blurb.appendChild(meta);

            const frameBlock = document.createElement('div');
            frameBlock.className = 'frameBlock';
            const bar = document.createElement('div');
            bar.className = 'frameBar';
            const left = document.createElement('span');
            left.textContent = 'canonical preview';
            const right = document.createElement('span');
            right.textContent = canonicalLabel(b);
            bar.appendChild(left);
            bar.appendChild(right);

            const frame = document.createElement('iframe');
            frame.className = 'iframeSlot';
            frame.title = b.title;
            const canonicalUrl = canonicalUrlForBlock(b);
            if (canonicalUrl && canonicalUrl.startsWith('http')) frame.src = canonicalUrl;
            else frame.srcdoc = iframeDocument(b, l, a);

            frameBlock.appendChild(bar);
            frameBlock.appendChild(frame);

            payload.appendChild(blurb);
            payload.appendChild(frameBlock);
            el.payloadShell.appendChild(payload);
        }
        function iframeDocument(b, l, a) {
            return '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;background:#fff6df;color:#000}body{display:grid;place-items:center;padding:18px}.box{width:100%;height:100%;border:3px solid #000;background:#fff;display:grid;place-items:center;text-align:center;padding:18px}h1{margin:0;font-size:clamp(34px,8vw,80px);line-height:.82;letter-spacing:-.08em;text-transform:uppercase}.path{margin-top:12px;font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.05em;color:rgba(0,0,0,.55)}p{font-size:clamp(16px,3vw,26px);font-weight:850;line-height:1.1}</style></head><body><main class="box"><div><h1>' + escapeHtml(b.title) + '</h1><p>' + escapeHtml(l.blurb) + '</p><div class="path">' + escapeHtml(a.compact) + '</div></div></main></body></html>';
        }
        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]; });
        }
        function openPayload() {
            pulse();
            const b = block();
            const canonicalUrl = canonicalUrlForBlock(b);
            if (canonicalUrl && canonicalUrl.startsWith('http')) {
                window.open(canonicalUrl, '_blank', 'noopener,noreferrer');
                return;
            }
            const opened = window.open('', '_blank', 'noopener,noreferrer');
            if (!opened) return;
            const a = address(), l = leaf();
            opened.document.write('<!doctype html><html><head><title>' + escapeHtml(b.title) + '</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;padding:24px;background:#fff6df;color:#000;font-family:Inter,system-ui,sans-serif}h1{font-size:clamp(42px,8vw,96px);line-height:.8;letter-spacing:-.09em;text-transform:uppercase}main{border:3px solid #000;padding:18px;min-height:70vh;background:#fff;font-size:20px;font-weight:850}.coord{font-family:monospace;font-weight:1000;text-transform:uppercase;color:rgba(0,0,0,.58)}</style></head><body><div class="coord">' + escapeHtml(a.compact) + '</div><h1>' + escapeHtml(b.title) + '</h1><main>' + escapeHtml(l.blurb) + '</main></body></html>');
            opened.document.close();
        }
        function createOrangeSvg(activeIndex, totalSegments) {
            totalSegments = Math.max(1, totalSegments || 6);
            activeIndex = ((activeIndex % totalSegments) + totalSegments) % totalSegments;
            const svg = svgEl('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true' });
            svg.appendChild(svgEl('circle', { cx: '50', cy: '50', r: '46', fill: 'var(--cream)', stroke: 'currentColor', 'stroke-width': '4' }));
            for (let i = 0; i < totalSegments; i++) {
                const angleStep = 360 / totalSegments;
                const a0 = (i * angleStep - 90) * Math.PI / 180;
                const a1 = ((i + 1) * angleStep - 90) * Math.PI / 180;
                const r = 46;
                const x0 = 50 + r * Math.cos(a0);
                const y0 = 50 + r * Math.sin(a0);
                const x1 = 50 + r * Math.cos(a1);
                const y1 = 50 + r * Math.sin(a1);
                const largeArc = angleStep > 180 ? 1 : 0;
                svg.appendChild(svgEl('path', {
                    d: 'M50 50 L' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z',
                    fill: activeIndex === i ? 'currentColor' : 'var(--cream)',
                    stroke: 'currentColor',
                    'stroke-width': '2'
                }));
            }
            svg.appendChild(svgEl('circle', { cx: '50', cy: '50', r: '14', fill: 'var(--bg)', stroke: 'currentColor', 'stroke-width': '3' }));
            return svg;
        }
        function updateViewDock() {
            if (!el.viewRails) return;
            el.viewRails.classList.toggle('active', state.view === 'rails');
            el.viewGrid.classList.toggle('active', state.view === 'grid');
            el.viewTimeline.classList.toggle('active', state.view === 'timeline');
        }
        function render() {
            clampState();
            document.body.setAttribute('data-view', state.view);
            renderRails();
            renderDetail();
            updateViewDock();
        }

        el.prevBtn.addEventListener('click', function () { nextLeaf(-1); });
        el.viewRails.addEventListener('click', function () { setView('rails'); });
        el.viewGrid.addEventListener('click', function () { setView('grid'); });
        el.viewTimeline.addEventListener('click', function () { setView('timeline'); });
        el.viewOpen.addEventListener('click', openPayload);
        el.nextBtn.addEventListener('click', function () { nextLeaf(1); });
        el.zoomBtn.addEventListener('click', cycleZoom);
        el.topTitleWrap.addEventListener('click', cycleZoom);
        el.openBtn.addEventListener('click', openPayload);
        window.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft') nextLeaf(-1);
            if (e.key === 'ArrowRight') nextLeaf(1);
            if (e.key.toLowerCase() === 'z') cycleZoom();
            if (e.key.toLowerCase() === 'r') setView('rails');
            if (e.key.toLowerCase() === 'g') setView('grid');
            if (e.key.toLowerCase() === 't') setView('timeline');
            if (e.key.toLowerCase() === 'o') openPayload();
            if (/^[1-9]$/.test(e.key)) selectC('C' + e.key);
        });
        whBridge.boot(function(data) {
            __bridgeData = data;
            archiveTiers = data.archiveTiers;
            archiveClusters = data.archiveClusters;
            archiveBlocks = data.archiveBlocks;
            leafTemplates = data.leafTemplates;
            if (typeof domains !== 'undefined' || true) { try { domains = archiveTiers; } catch(e){} }
            if (typeof clusters !== 'undefined' || true) { try { clusters = archiveClusters; } catch(e){} }
            if (typeof blocks !== 'undefined' || true) { try { blocks = archiveBlocks; } catch(e){} }
            if (typeof works !== 'undefined' || true) {
                try { works = archiveBlocks.map(function(b){ return b.name; }); } catch(e){}
            }
            if (typeof repos !== 'undefined' || true) { try { repos = data.repos || []; } catch(e){} }
            if (typeof leaves !== 'undefined' || true) {
                try {
                    leaves = leafTemplates.map(function(pair, i) {
                        var id = String(i + 1).padStart(2, '0');
                        var owner = archiveBlocks.find(function(bl) { return bl.leaves && bl.leaves.includes(id); });
                        return { id: id, block: owner ? owner.id : 'B1', b: owner ? owner.id : 'B1', title: pair[0] + ' · ' + (owner ? owner.title : 'Worldtext'), art: ['grid','synth','poster','curve','type','color'][i % 6], url: owner && owner.url ? owner.url : '#', date: '2026-01-' + id, lines: [pair[1], owner ? owner.title : 'Worldtext Practice Archive', owner && owner.url ? owner.url : 'payload://local', 'Mode button cycles text, media, iframe, empty.'] };
                    });
                } catch(e){}
            }
            render();
        });
    </script>
