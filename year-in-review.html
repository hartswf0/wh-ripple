<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year in Review — Repo Genome Patches</title>
<meta name="description" content="168 repos. 12 months. One evolving world-model. Spatio-temporal semantic patches.">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--surface:#12121a;--card:#1a1a28;--border:#2a2a3a;
  --text:#e0e0e8;--muted:#888;--accent:#ff6b35;
  --seed:#52b788;--sketch:#36a9e1;--proto:#f7931e;--instrument:#e74c3c;
  --seeding:#52b788;--eruption:#ff6b35;--consolidation:#36a9e1;--operationalization:#9b59b6;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:16px 24px}
.header h1{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
.header-stats{display:flex;gap:20px;margin-top:8px;font-size:12px;color:var(--muted)}
.header-stats span{display:flex;align-items:center;gap:4px}
.stat-num{color:var(--text);font-weight:600;font-family:'JetBrains Mono',monospace}

/* FILTERS */
.filters{display:flex;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--surface)}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-btn.phase-seed{--fc:var(--seeding)}.filter-btn.phase-erupt{--fc:var(--eruption)}
.filter-btn.phase-consol{--fc:var(--consolidation)}.filter-btn.phase-oper{--fc:var(--operationalization)}
.filter-btn.phase-seed.active{background:var(--seeding);border-color:var(--seeding)}
.filter-btn.phase-erupt.active{background:var(--eruption);border-color:var(--eruption)}
.filter-btn.phase-consol.active{background:var(--consolidation);border-color:var(--consolidation)}
.filter-btn.phase-oper.active{background:var(--operationalization);border-color:var(--operationalization)}

/* PHASE BARS */
.phase-bar{display:flex;height:6px;margin:0 24px}
.phase-segment{height:100%;transition:flex .3s}

/* TIMELINE */
.timeline{padding:16px 24px 80px;position:relative}
.month-group{margin-bottom:32px}
.month-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;position:sticky;top:70px;background:var(--bg);padding:8px 0;z-index:10;display:flex;align-items:center;gap:12px}
.month-label .count{background:var(--card);border:1px solid var(--border);padding:2px 8px;border-radius:10px;font-size:10px}
.month-line{width:2px;flex:1;height:1px;background:var(--border)}
.patches{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}

/* PATCH CARD */
.patch{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.patch:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.patch::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:8px 0 0 8px}
.patch-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.patch-id{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);opacity:.6}
.patch-name{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--text);word-break:break-word}
.patch-desc{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.patch-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.badge{font-size:9px;padding:2px 6px;border-radius:3px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.5px}
.badge-maturity{border:1px solid}
.badge-maturity.seed{color:var(--seed);border-color:var(--seed)}.badge-maturity.sketch{color:var(--sketch);border-color:var(--sketch)}
.badge-maturity.prototype{color:var(--proto);border-color:var(--proto)}.badge-maturity.instrument{color:var(--instrument);border-color:var(--instrument)}
.badge-theme{background:rgba(255,255,255,.06);color:var(--muted)}
.badge-constellation{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:8px}
.patch-meta{display:flex;gap:12px;margin-top:8px;font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}

/* EXPANDED PANEL */
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s}
.panel-overlay.open{opacity:1;pointer-events:all}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(520px,90vw);background:var(--surface);z-index:201;transform:translateX(100%);transition:transform .3s;overflow-y:auto;border-left:1px solid var(--border)}
.panel.open{transform:translateX(0)}
.panel-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;z-index:5;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.panel-close:hover{background:var(--card);color:var(--text)}
.panel-content{padding:24px}
.panel-section{margin-bottom:24px}
.panel-section h3{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.panel-section h2{font-family:'JetBrains Mono',monospace;font-size:16px;margin-bottom:4px}
.genome-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,.04)}
.genome-row .label{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px}
.genome-row .value{color:var(--text);text-align:right;max-width:60%}
.entity-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.entity-tag{font-size:10px;padding:2px 6px;border-radius:3px;font-family:'JetBrains Mono',monospace}
.entity-tag.ent{background:rgba(82,183,136,.15);color:var(--seed);border:1px solid rgba(82,183,136,.3)}
.entity-tag.morph{background:rgba(54,169,225,.15);color:var(--sketch);border:1px solid rgba(54,169,225,.3)}
.entity-tag.grp{background:rgba(155,89,182,.15);color:#9b59b6;border:1px solid rgba(155,89,182,.3)}
.lineage-link{color:var(--accent);cursor:pointer;text-decoration:underline;font-size:11px}
.lineage-link:hover{color:#fff}
.theory-block{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;margin-top:8px;font-size:11px;line-height:1.6}
.theory-block .problem{color:var(--text);margin-bottom:8px}
.theory-block .tool-for{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:10px}
.confidence-bar{display:inline-block;padding:2px 8px;border-radius:3px;font-size:9px;font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.confidence-bar.strongly_inferred{background:rgba(82,183,136,.2);color:var(--seed)}
.confidence-bar.weakly_inferred{background:rgba(247,147,30,.2);color:var(--proto)}
.confidence-bar.name_only{background:rgba(231,76,60,.2);color:var(--instrument)}
.trail-bar{height:4px;background:var(--border);border-radius:2px;margin-top:4px}
.trail-bar-fill{height:100%;border-radius:2px;transition:width .3s}
.panel-actions{display:flex;gap:8px;margin-top:12px}
.panel-actions a{display:inline-block;padding:6px 14px;border-radius:4px;font-size:11px;text-decoration:none;font-family:'JetBrains Mono',monospace}
.btn-primary{background:var(--accent);color:#fff}.btn-secondary{border:1px solid var(--border);color:var(--muted)}
.btn-primary:hover{background:#e05a2a}.btn-secondary:hover{border-color:var(--text);color:var(--text)}

/* SEARCH */
.search-box{padding:8px 24px;background:var(--bg)}
.search-box input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:6px;font-size:12px;font-family:'JetBrains Mono',monospace;outline:none}
.search-box input:focus{border-color:var(--accent)}
.search-box input::placeholder{color:var(--muted)}

@media(max-width:600px){
  .patches{grid-template-columns:1fr}
  .filters{overflow-x:auto;flex-wrap:nowrap}
  .header-stats{flex-wrap:wrap;gap:8px}
}
</style>
</head>
<body>
<div class="header">
  <h1>Repo Genome Patches — Year in Review</h1>
  <div class="header-stats">
    <span><span class="stat-num" id="total-count">—</span> patches</span>
    <span><span class="stat-num" id="visible-count">—</span> visible</span>
    <span>May 2025 — Apr 2026</span>
    <span>Scanner v2.0</span>
  </div>
</div>

<div class="search-box">
  <input type="text" id="search" placeholder="Search repos, descriptions, vocabulary...">
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">ALL</button>
  <button class="filter-btn phase-seed" data-filter="phase:SEEDING">SEEDING</button>
  <button class="filter-btn phase-erupt" data-filter="phase:ERUPTION">ERUPTION</button>
  <button class="filter-btn phase-consol" data-filter="phase:CONSOLIDATION">CONSOLIDATION</button>
  <button class="filter-btn phase-oper" data-filter="phase:OPERATIONALIZATION">OPERATIONALIZATION</button>
  <span style="width:1px;background:var(--border);margin:0 4px"></span>
  <button class="filter-btn" data-filter="maturity:seed">seed</button>
  <button class="filter-btn" data-filter="maturity:sketch">sketch</button>
  <button class="filter-btn" data-filter="maturity:prototype">prototype</button>
  <button class="filter-btn" data-filter="maturity:instrument">instrument</button>
</div>

<div class="phase-bar" id="phase-bar"></div>

<div class="timeline" id="timeline"></div>

<div class="panel-overlay" id="panel-overlay"></div>
<div class="panel" id="panel">
  <button class="panel-close" id="panel-close">&times;</button>
  <div class="panel-content" id="panel-content"></div>
</div>

<script>
let data = null;
let activeFilter = 'all';
let searchQuery = '';

async function init(){
  const resp = await fetch('genome-patches.json');
  data = await resp.json();
  document.getElementById('total-count').textContent = data.meta.total_patches;
  renderPhaseBar();
  renderTimeline();
  setupEvents();
}

function renderPhaseBar(){
  const bar = document.getElementById('phase-bar');
  const phases = data.summary.phase_counts;
  const total = Object.values(phases).reduce((a,b)=>a+b,0);
  const colors = {SEEDING:'var(--seeding)',ERUPTION:'var(--eruption)',CONSOLIDATION:'var(--consolidation)',OPERATIONALIZATION:'var(--operationalization)'};
  const order = ['SEEDING','ERUPTION','CONSOLIDATION','OPERATIONALIZATION'];
  bar.innerHTML = order.map(p=>{
    const pct = ((phases[p]||0)/total*100);
    return `<div class="phase-segment" style="flex:${pct};background:${colors[p]}" title="${p}: ${phases[p]} repos"></div>`;
  }).join('');
}

function getFilteredPatches(){
  let patches = data.patches;
  if(activeFilter !== 'all'){
    const [type, val] = activeFilter.split(':');
    patches = patches.filter(p=>{
      if(type==='phase') return p.phase===val;
      if(type==='maturity') return p.timeline_genome.maturity_stage===val;
      if(type==='theme') return p.timeline_genome.theme===val;
      if(type==='constellation') return p.timeline_genome.all_constellations.includes(val);
      return true;
    });
  }
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    patches = patches.filter(p=>{
      const text = `${p.repo_name} ${p.timeline_genome.one_line_summary} ${p.timeline_genome.theme} ${p.timeline_genome.constellation} ${(p.vocabulary_genome.key_entities||[]).join(' ')} ${p.timeline_genome.maturity_stage} ${p.phase}`.toLowerCase();
      return text.includes(q);
    });
  }
  return patches;
}

function renderTimeline(){
  const container = document.getElementById('timeline');
  const patches = getFilteredPatches();
  document.getElementById('visible-count').textContent = patches.length;

  const byMonth = {};
  patches.forEach(p=>{
    if(!byMonth[p.month]) byMonth[p.month]=[];
    byMonth[p.month].push(p);
  });

  const months = Object.keys(byMonth).sort();
  container.innerHTML = months.map(m=>{
    const ps = byMonth[m];
    const dt = new Date(m+'-15');
    const label = dt.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    return `
      <div class="month-group">
        <div class="month-label">${label} <span class="count">${ps.length}</span><div class="month-line"></div></div>
        <div class="patches">${ps.map(p=>renderPatchCard(p)).join('')}</div>
      </div>`;
  }).join('');
}

function renderPatchCard(p){
  const tg = p.timeline_genome;
  const maturity = tg.maturity_stage;
  const color = tg.theme_color;
  const constellations = tg.all_constellations.slice(0,2);
  const trail = p.creator_trail_genome;
  const sizeTxt = p.artifact_genome.size_mb > 1 ? `${p.artifact_genome.size_mb.toFixed(1)}MB` : `${Math.round(p.artifact_genome.size_mb*1024)}KB`;

  return `
    <div class="patch" data-patch-id="${p.patch_id}" style="--tc:${color}" onclick="openPanel('${p.patch_id}')">
      <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${color};border-radius:8px 0 0 8px"></div>
      <div class="patch-header">
        <div class="patch-name">${p.repo_name}</div>
        <div class="patch-id">${p.patch_id}</div>
      </div>
      <div class="patch-desc">${tg.one_line_summary}</div>
      <div class="patch-badges">
        <span class="badge badge-maturity ${maturity}">${maturity}</span>
        <span class="badge badge-theme">${tg.theme.split('&')[0].trim()}</span>
        ${constellations.map(c=>`<span class="badge badge-constellation">${c.replace(' Constellation','')}</span>`).join('')}
      </div>
      <div class="patch-meta">
        <span>${sizeTxt}</span>
        <span>${trail.making_pattern.replace('_',' ')}</span>
        ${p.artifact_genome.has_pages?'<span>pages</span>':''}
      </div>
    </div>`;
}

function openPanel(patchId){
  const p = data.patches.find(x=>x.patch_id===patchId);
  if(!p) return;

  const tg = p.timeline_genome;
  const ag = p.artifact_genome;
  const vg = p.vocabulary_genome;
  const pt = p.program_theory_capsule;
  const ct = p.creator_trail_genome;
  const lg = p.lineage_genome;
  const ev = pt.evidence;

  const content = document.getElementById('panel-content');
  content.innerHTML = `
    <div class="panel-section">
      <h2 style="color:${tg.theme_color}">${p.repo_name}</h2>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${tg.one_line_summary}</div>
      <div class="panel-actions">
        ${ag.has_pages?`<a href="${ag.pages_url}" target="_blank" class="btn-primary">Open Pages</a>`:''}
        <a href="${ag.github_url}" target="_blank" class="btn-secondary">GitHub</a>
      </div>
    </div>

    <div class="panel-section">
      <h3>Timeline Genome</h3>
      <div class="genome-row"><span class="label">patch_id</span><span class="value">${p.patch_id}</span></div>
      <div class="genome-row"><span class="label">created</span><span class="value">${new Date(p.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span></div>
      <div class="genome-row"><span class="label">phase</span><span class="value" style="color:var(--${p.phase.toLowerCase()})">${p.phase}</span></div>
      <div class="genome-row"><span class="label">quarter</span><span class="value">${p.quarter}</span></div>
      <div class="genome-row"><span class="label">maturity</span><span class="value"><span class="badge badge-maturity ${tg.maturity_stage}">${tg.maturity_stage}</span></span></div>
      <div class="genome-row"><span class="label">theme</span><span class="value">${tg.theme}</span></div>
      <div class="genome-row"><span class="label">constellation</span><span class="value">${tg.constellation}</span></div>
      ${tg.all_constellations.length>1?`<div class="genome-row"><span class="label">also in</span><span class="value">${tg.all_constellations.slice(1).join(', ')}</span></div>`:''}
    </div>

    <div class="panel-section">
      <h3>Artifact Genome</h3>
      <div class="genome-row"><span class="label">type</span><span class="value">${ag.artifact_type}</span></div>
      <div class="genome-row"><span class="label">language</span><span class="value">${ag.primary_language}</span></div>
      <div class="genome-row"><span class="label">size</span><span class="value">${ag.size_mb>1?ag.size_mb.toFixed(1)+'MB':Math.round(ag.size_mb*1024)+'KB'}</span></div>
      <div class="genome-row"><span class="label">deployment</span><span class="value">${ag.deployment_shape}</span></div>
    </div>

    <div class="panel-section">
      <h3>Program Theory Capsule</h3>
      <div class="theory-block">
        <div class="problem">${pt.initial_interpretation.program_theory_problem}</div>
        <div class="tool-for">tool_for: ${pt.initial_interpretation.repo_as_tool_for}</div>
      </div>
      <div style="margin-top:8px">
        <span class="confidence-bar ${ev.confidence}">${ev.confidence}</span>
        <span style="font-size:10px;color:var(--muted);margin-left:8px">scan: ${ev.scan_level}</span>
      </div>
      ${pt.theory_skeleton.entities.length?`
        <div style="margin-top:10px;font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace">ENTITIES</div>
        <div class="entity-list">${pt.theory_skeleton.entities.map(e=>`<span class="entity-tag ent">${e}</span>`).join('')}</div>
      `:''}
      ${pt.theory_skeleton.operations.length?`
        <div style="margin-top:8px;font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace">OPERATIONS</div>
        <div class="entity-list">${pt.theory_skeleton.operations.map(o=>`<span class="entity-tag morph">${o}</span>`).join('')}</div>
      `:''}
    </div>

    <div class="panel-section">
      <h3>Vocabulary Genome</h3>
      ${vg.key_entities.length?`
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px;font-family:'JetBrains Mono',monospace">ENTITIES</div>
        <div class="entity-list">${vg.key_entities.map(e=>`<span class="entity-tag ent">&lt;${e}&gt;</span>`).join('')}</div>
      `:''}
      ${vg.key_morphisms.length?`
        <div style="font-size:10px;color:var(--muted);margin-top:8px;margin-bottom:4px;font-family:'JetBrains Mono',monospace">MORPHISMS</div>
        <div class="entity-list">${vg.key_morphisms.map(m=>`<span class="entity-tag morph">[${m}]</span>`).join('')}</div>
      `:''}
      ${vg.key_groups.length?`
        <div style="font-size:10px;color:var(--muted);margin-top:8px;margin-bottom:4px;font-family:'JetBrains Mono',monospace">GROUPS</div>
        <div class="entity-list">${vg.key_groups.map(g=>`<span class="entity-tag grp">{${g}}</span>`).join('')}</div>
      `:''}
    </div>

    <div class="panel-section">
      <h3>Creator Trail Genome</h3>
      <div class="genome-row"><span class="label">trail_maturity</span><span class="value">${ct.trail_maturity_label}</span></div>
      <div class="genome-row"><span class="label">making_pattern</span><span class="value">${ct.making_pattern}</span></div>
      <div class="genome-row"><span class="label">lifespan</span><span class="value">${ct.process_metadata.lifespan_days}d</span></div>
      <div class="genome-row"><span class="label">commits</span><span class="value">${ct.process_metadata.commits}</span></div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5">${ct.making_notes}</div>
    </div>

    ${(lg.parent_repos.length||lg.sibling_repos.length||lg.descendant_repos.length)?`
    <div class="panel-section">
      <h3>Lineage Genome</h3>
      ${lg.parent_repos.length?`<div class="genome-row"><span class="label">parents</span><span class="value">${lg.parent_repos.map(r=>`<span class="lineage-link" onclick="jumpToRepo('${r}')">${r}</span>`).join(', ')}</span></div>`:''}
      ${lg.sibling_repos.length?`<div class="genome-row"><span class="label">siblings</span><span class="value">${lg.sibling_repos.map(r=>`<span class="lineage-link" onclick="jumpToRepo('${r}')">${r}</span>`).join(', ')}</span></div>`:''}
      ${lg.descendant_repos.length?`<div class="genome-row"><span class="label">descendants</span><span class="value">${lg.descendant_repos.map(r=>`<span class="lineage-link" onclick="jumpToRepo('${r}')">${r}</span>`).join(', ')}</span></div>`:''}
    </div>
    `:''}
  `;

  document.getElementById('panel').classList.add('open');
  document.getElementById('panel-overlay').classList.add('open');
}

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('panel-overlay').classList.remove('open');
}

function jumpToRepo(name){
  closePanel();
  const patch = data.patches.find(p=>p.repo_name===name);
  if(patch){
    setTimeout(()=>openPanel(patch.patch_id),300);
  }
}

function setupEvents(){
  document.getElementById('panel-close').addEventListener('click',closePanel);
  document.getElementById('panel-overlay').addEventListener('click',closePanel);

  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderTimeline();
    });
  });

  let searchTimeout;
  document.getElementById('search').addEventListener('input',(e)=>{
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(()=>{
      searchQuery = e.target.value;
      renderTimeline();
    },200);
  });

  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape') closePanel();
  });
}

init();
</script>
</body>
</html>
