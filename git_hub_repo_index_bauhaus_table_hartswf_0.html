<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watson Hartsoe — 311 Repos</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:#fff;color:#000;
      font:13px/1.4 'JetBrains Mono',monospace;
    }

    /* HEADER */
    header{
      position:sticky;top:0;z-index:10;
      background:#fff;border-bottom:2px solid #000;
      padding:12px 20px;
      display:flex;justify-content:space-between;align-items:center;
      flex-wrap:wrap;gap:8px;
    }
    .title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
    .title span{font-weight:400;color:#666}
    .controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .search{
      border:1px solid #000;padding:5px 10px;font:11px 'JetBrains Mono',monospace;
      width:200px;outline:none;background:#fff;
    }
    .search:focus{box-shadow:inset 0 -2px 0 #000}
    .sort-btn{
      border:1px solid #000;background:#fff;color:#000;
      padding:4px 8px;font:10px 'JetBrains Mono',monospace;
      cursor:pointer;text-transform:uppercase;letter-spacing:.5px;
    }
    .sort-btn:hover,.sort-btn.active{background:#000;color:#fff}
    .summary{font-size:10px;color:#666}

    /* MAIN LAYOUT: list left, preview right */
    .layout{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 52px)}
    @media(max-width:800px){.layout{grid-template-columns:1fr;height:auto}}

    /* REPO LIST */
    .list{overflow-y:auto;border-right:1px solid #000}
    .card{
      border-bottom:1px solid #e0e0e0;padding:10px 16px;cursor:pointer;
      transition:background .1s;display:flex;gap:10px;align-items:flex-start;
    }
    .card:hover{background:#f4f4f4}
    .card.active{background:#000;color:#fff}
    .card.active .card-desc{color:#aaa}
    .card.active .card-meta{color:#888}
    .card.active .card-badge{background:#fff;color:#000}

    .card-rank{
      font-size:9px;color:#aaa;min-width:24px;text-align:right;
      padding-top:2px;flex-shrink:0;
    }
    .card.active .card-rank{color:#666}
    .card-body{flex:1;min-width:0}
    .card-name{font-size:12px;font-weight:700;text-transform:uppercase;word-break:break-word}
    .card-desc{font-size:10px;color:#666;margin-top:2px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .card-meta{display:flex;gap:6px;margin-top:4px;font-size:9px;color:#888;flex-wrap:wrap}
    .card-badge{
      display:inline-block;background:#000;color:#fff;
      padding:0 4px;font-size:8px;text-transform:uppercase;letter-spacing:.3px;
    }
    .card.active .card-badge{background:#fff;color:#000}
    .touch-bar{
      height:2px;background:#e0e0e0;margin-top:4px;border-radius:1px;
    }
    .touch-bar-fill{height:100%;background:#000;border-radius:1px}
    .card.active .touch-bar{background:#333}
    .card.active .touch-bar-fill{background:#fff}

    /* PREVIEW PANE */
    .preview{background:#f8f8f8;display:flex;flex-direction:column;position:relative}
    .preview-header{
      padding:8px 16px;border-bottom:1px solid #e0e0e0;
      display:flex;justify-content:space-between;align-items:center;
      background:#fff;font-size:10px;
    }
    .preview-title{font-weight:700;text-transform:uppercase}
    .preview-links{display:flex;gap:8px}
    .preview-links a{
      color:#000;text-decoration:none;border-bottom:1px solid #000;
      font-size:10px;padding-bottom:1px;
    }
    .preview-links a:hover{opacity:.5}
    .preview-frame{flex:1;border:none;width:100%;height:100%;background:#fff}
    .preview-empty{
      flex:1;display:flex;align-items:center;justify-content:center;
      font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:2px;
    }
    @media(max-width:800px){
      body { display: flex; flex-direction: column; }
      .layout { display: flex; flex-direction: column; flex: 1; height: auto; }
      .preview { flex: 0 0 50vh; border-bottom: 2px solid #000; border-top: none; order: 1; }
      .list { flex: 1; overflow-y: auto; max-height: none; order: 2; border-right: none; }
    }
  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23000%22/></svg>">
</head>
<body>
  <header>
    <div class="title">Watson Hartsoe <span id="count"></span></div>
    <div class="controls">
      <input class="search" id="search" type="text" placeholder="Search...">
      <button class="sort-btn active" data-sort="touches">Touches</button>
      <button class="sort-btn" data-sort="updated">Recent</button>
      <button class="sort-btn" data-sort="size">Size</button>
      <button class="sort-btn" data-sort="name">Name</button>
    </div>
  </header>

  <div class="layout">
    <div class="list" id="list"></div>
    <div class="preview" id="preview">
      <div class="preview-empty">Select a repo</div>
    </div>
  </div>

  <script>
  (function(){
    let repos = [];
    let audit = {};
    let sortKey = 'touches';
    let query = '';
    let activeRepo = null;
    let maxTouches = 1;

    async function init(){
      // Load both data sources
      const [repoResp, auditResp] = await Promise.all([
        fetch('github-ripple-index.json'),
        fetch('genome-patches.json').catch(()=>null)
      ]);

      const repoData = await repoResp.json();
      repos = repoData.all_repos;

      // Build audit lookup from genome patches
      if(auditResp && auditResp.ok){
        const gp = await auditResp.json();
        gp.patches.forEach(p => {
          audit[p.repo_name] = {
            touches: p.creator_trail_genome.authored_touches || 0,
            maturity: p.timeline_genome.maturity_stage,
            theme: p.timeline_genome.theme,
            primary_organ: p.creator_trail_genome.primary_organ || '',
            making_pattern: p.creator_trail_genome.making_pattern || '',
            phase: p.phase,
          };
        });
      }

      // Attach audit data to repos
      repos.forEach(r => {
        const a = audit[r.name] || {};
        r._touches = a.touches || 0;
        r._maturity = a.maturity || 'unknown';
        r._theme = a.theme || '';
        r._organ = a.primary_organ || '';
        r._pattern = a.making_pattern || '';
        r._phase = a.phase || '';
      });

      maxTouches = Math.max(...repos.map(r => r._touches), 1);

      document.getElementById('count').textContent = `· ${repos.length} repos`;
      sortAndRender();
      setupEvents();
    }

    function getFiltered(){
      let list = repos;
      if(query){
        const q = query.toLowerCase();
        list = list.filter(r => {
          const hay = `${r.name} ${r.description||''} ${r._theme} ${r._maturity}`.toLowerCase();
          return hay.includes(q);
        });
      }
      return list;
    }

    function sortRepos(list){
      const copy = [...list];
      switch(sortKey){
        case 'touches':
          copy.sort((a,b) => b._touches - a._touches || a.name.localeCompare(b.name));
          break;
        case 'updated':
          copy.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
          break;
        case 'size':
          copy.sort((a,b) => b.size_kb - a.size_kb);
          break;
        case 'name':
          copy.sort((a,b) => a.name.localeCompare(b.name));
          break;
      }
      return copy;
    }

    function sortAndRender(){
      const filtered = getFiltered();
      const sorted = sortRepos(filtered);
      renderList(sorted);
    }

    function renderList(list){
      const container = document.getElementById('list');
      container.innerHTML = '';
      list.forEach((r, i) => {
        const card = document.createElement('div');
        card.className = 'card' + (activeRepo === r.name ? ' active' : '');
        const touchPct = maxTouches > 0 ? (r._touches / maxTouches * 100) : 0;
        const sizeTxt = r.size_kb > 1024 ? (r.size_kb/1024).toFixed(1)+'MB' : Math.round(r.size_kb)+'KB';

        card.innerHTML = `
          <div class="card-rank">${i+1}</div>
          <div class="card-body">
            <div class="card-name">${r.name}</div>
            <div class="card-desc">${r.description || '\u2014'}</div>
            <div class="card-meta">
              ${r._touches ? `<span>${r._touches}t</span>` : ''}
              <span>${sizeTxt}</span>
              ${r.language ? `<span>${r.language}</span>` : ''}
              ${r._maturity !== 'unknown' ? `<span class="card-badge">${r._maturity}</span>` : ''}
              ${r.has_pages ? '<span class="card-badge">pages</span>' : ''}
            </div>
            ${r._touches ? `<div class="touch-bar"><div class="touch-bar-fill" style="width:${touchPct}%"></div></div>` : ''}
          </div>
        `;
        card.addEventListener('click', () => selectRepo(r));
        container.appendChild(card);
      });
    }

    function selectRepo(r){
      activeRepo = r.name;
      // Re-render list to update active state
      sortAndRender();

      const preview = document.getElementById('preview');
      const pagesUrl = r.has_pages
        ? `https://hartswf0.github.io/${r.name}/`
        : null;

      preview.innerHTML = `
        <div class="preview-header">
          <div class="preview-title">${r.name}</div>
          <div class="preview-links">
            ${pagesUrl ? `<a href="${pagesUrl}" target="_blank">Open in new tab</a>` : ''}
            <a href="${r.html_url}" target="_blank">GitHub</a>
          </div>
        </div>
        ${pagesUrl
          ? `<iframe class="preview-frame" src="${pagesUrl}" sandbox="allow-scripts allow-same-origin" allow="autoplay 'none'; camera 'none'; microphone 'none'" loading="lazy"></iframe>`
          : `<div class="preview-empty">No Pages deployment<br><a href="${r.html_url}" target="_blank" style="color:#000;font-size:10px">View source on GitHub</a></div>`
        }
      `;
    }

    function setupEvents(){
      document.getElementById('search').addEventListener('input', e => {
        query = e.target.value;
        sortAndRender();
      });

      document.querySelectorAll('.sort-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          sortKey = btn.dataset.sort;
          sortAndRender();
        });
      });

      // Keyboard: arrow keys navigate list
      document.addEventListener('keydown', e => {
        if(e.target.matches('input')) return;
        const cards = document.querySelectorAll('.card');
        if(!cards.length) return;
        const currentIdx = [...cards].findIndex(c => c.classList.contains('active'));
        if(e.key === 'ArrowDown' || e.key === 'j'){
          e.preventDefault();
          const next = Math.min(currentIdx + 1, cards.length - 1);
          cards[next].click();
          cards[next].scrollIntoView({block:'nearest'});
        }
        if(e.key === 'ArrowUp' || e.key === 'k'){
          e.preventDefault();
          const prev = Math.max(currentIdx - 1, 0);
          cards[prev].click();
          cards[prev].scrollIntoView({block:'nearest'});
        }
      });
    }

    init();
  })();
  </script>
</body>
</html>
